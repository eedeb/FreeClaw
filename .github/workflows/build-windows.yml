# Build the Windows package.
#
# There is no way to produce it on Linux or macOS: the bundled interpreter is
# the Windows embeddable distribution, and the build installs its dependencies
# with it. This workflow is therefore the reference build — run it from the
# Actions tab, or push a v* tag to attach the package to a release.

name: Build Windows package

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    # write, not read: the tagged path creates a GitHub release. The
    # workflow_dispatch path never uses it.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Build package
        shell: pwsh
        # No -PythonSha256 here on purpose: pinning it would mean editing this
        # file on every Python patch release, and the download is already
        # HTTPS from python.org.
        run: .\windows\build.ps1 -PythonVersion 3.12.8

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $v = (Get-Content VERSION -Raw).Trim()
          "version=$v" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: FreeClaw-${{ steps.version.outputs.version }}-win64
          path: |
            dist/FreeClaw-*-win64.zip
            dist/FreeClaw-*-win64.zip.sha256
          if-no-files-found: error

      # Both files, always. install.ps1 resolves the latest release, downloads
      # the zip and checks it against the .sha256 published beside it — ship
      # the zip alone and every install falls back to a size-only check.
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/FreeClaw-*-win64.zip
            dist/FreeClaw-*-win64.zip.sha256
