  // Which apps the agent is in the middle of using. Each tool_call that goes
  // to an MCP server names it (agent.py); the glow stays on until the
  // result comes back, and for a beat longer so a quick call still shows.
  const appUsage = (() => {
    const MIN_MS = 900;
    const running = new Map();   // server name -> started at
    const timers = new Map();

    function iconsFor(name) {
      const out = [];
      const el = mcpIconEl(name);
      if (el) out.push(el);
      // The builtin browser has no app icon of its own — light the Browser.
      const s = mcpServers.find(x => x.name === name);
      if (s && s.builtin && s.browser) {
        const b = document.getElementById('icon-browser');
        if (b && !b.hidden) out.push(b);
      }
      return out;
    }

    return {
      active: name => running.has(name),
      start(name) {
        if (!name) return;
        clearTimeout(timers.get(name));
        timers.delete(name);
        running.set(name, performance.now());
        iconsFor(name).forEach(el => el.classList.add('using'));
        if (mcpWindow.name === name) mcpWindow.sync();
      },
      stop(name) {
        if (!running.has(name)) return;
        const left = Math.max(0, MIN_MS - (performance.now() - running.get(name)));
        clearTimeout(timers.get(name));
        timers.set(name, setTimeout(() => {
          timers.delete(name);
          running.delete(name);
          iconsFor(name).forEach(el => el.classList.remove('using'));
          if (mcpWindow.name === name) mcpWindow.sync();
        }, left));
      },
      stopAll() { [...running.keys()].forEach(n => this.stop(n)); },
    };
  })();

  // ── Agent browser ──────────────────────────────────────────────────
  // Replays the agent's browser tool calls as they stream in: the address
  // bar types, the page loads, a cursor goes and clicks what the agent
  // clicked. Purely a picture of what happened, drawn from the tool_call
  // arguments and the tool_result text — nothing here drives or fetches
  // anything.
  //
  // Kept cheap on purpose: one page of at most a few dozen elements exists at
  // a time (the old one is removed once it has faded), results are parsed and
  // dropped, all motion is transform/opacity, and while the window is hidden
  // or minimised every step runs with no delays at all.
  const agentBrowser = (() => {
    const win      = winEl('agent');
    const view     = win.querySelector('.ab-view');
    const addr     = win.querySelector('.ab-addr');
    const urlEl    = win.querySelector('.ab-url');
    const prog     = win.querySelector('.ab-progress');
    const scan     = win.querySelector('.ab-scan');
    const cursor   = win.querySelector('.ab-cursor');
    const ripple   = win.querySelector('.ab-ripple');
    const statusEl = win.querySelector('.ab-status-text');
    const PAGE_W = 760;   // the pretend page's layout width, scaled to fit

    // Which tool names belong to a browser. MCP tools arrive as
    // 'mcp_<server>_<tool>' (agent.py's _sanitize_tool_name), and the servers
    // that are browsers say so in /api/mcp. The built-in one always counts.
    const BUILTIN = 'mcp_shadow-web_';
    let prefixes = [BUILTIN];
    const sanitize = n => String(n || '').replace(/[^0-9A-Za-z_-]/g, '_').replace(/^_+|_+$/g, '');
    function setServers(names) {
      prefixes = [BUILTIN, ...(names || []).map(n => sanitize('mcp_' + n) + '_')];
    }
    // Tools that work on HTML handed to them rather than on the browser.
    const NOT_BROWSING = /^(compress_html|compress_html_to_xml|shadow_grep_html|schema_(table|form|list|page|json|csv))$/;
    function kindOf(name) {
      const p = prefixes.find(pre => String(name).startsWith(pre));
      if (!p) return null;
      const t = name.slice(p.length).toLowerCase();
      if (NOT_BROWSING.test(t)) return null;
      if (/search/.test(t)) return 'search';
      if (/navigate|goto|go_to|open/.test(t)) return 'nav';
      if (/click|press|tap/.test(t)) return 'click';
      if (!/form_fill/.test(t) && /fill|type/.test(t)) return 'fill';
      return 'read';
    }

    let page = null, scale = 1, scroll = 0, url = '', lastQuery = '';
    let cur = { x: 40, y: 40 };
    let chain = Promise.resolve(), pending = 0, gen = 0;
    let auto = false, touched = false, dismissed = false, closeTimer = null;

    // ── pacing ──
    // Steps run strictly in order. When results pile up faster than the
    // animation plays (quick clicks), it speeds up to catch up; when nobody can
    // see it, it doesn't wait at all.
    const shown = () => !win.hidden && !win.classList.contains('minimized') && !document.hidden;
    const wait = ms => new Promise(r => setTimeout(r, !shown() ? 0 : pending > 2 ? ms * 0.3 : ms));
    function queue(fn) {
      const g = gen;
      pending++;
      chain = chain
        .then(() => (g === gen ? fn() : null))
        .catch(e => console.warn('[agent browser]', e))
        .then(() => { if (g === gen) pending--; });
    }

    // ── little helpers ──
    const clip = (s, n) => {
      s = String(s == null ? '' : s).replace(/\s+/g, ' ').trim();
      return s.length > n ? s.slice(0, n - 1) + '…' : s;
    };
    function parseUrl(u) {
      try { return new URL(/^[a-z][a-z0-9+.-]*:/i.test(u) ? u : 'https://' + u); } catch (_) { return null; }
    }
    const hostOf = u => { const p = parseUrl(u || ''); return p ? p.hostname.replace(/^www\./, '') : clip(u, 60); };
    const pretty = u => {
      const p = parseUrl(u || '');
      if (!p) return clip(u, 200);
      return clip(p.hostname.replace(/^www\./, '') + (p.pathname === '/' ? '' : p.pathname) + p.search, 200);
    };
    function hueOf(s) { let h = 7; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) % 360; return h; }
    function el(tag, cls, text) {
      const e = document.createElement(tag);
      if (cls) e.className = cls;
      if (text != null) e.textContent = text;   // site text only ever goes in as text
      return e;
    }
    function lines(parent, n, seed) {
      for (let i = 0; i < n; i++) {
        const l = el('div', 'abp-line');
        l.style.width = (52 + ((seed * 7 + i * 23) % 42)) + '%';
        parent.append(l);
      }
    }
    const status = t => { statusEl.textContent = t; };

    // Tool results are JSON text from shadow-web, occasionally cut short. Only
    // the few fields drawn below are ever used.
    function parse(res) {
      const t = String(res || '').trim();
      if (!t) return null;
      if (/^(error|mcp error|no result)/i.test(t)) return { error: clip(t, 220) };
      if (t[0] === '{') {
        try { const o = JSON.parse(t); if (o && typeof o === 'object') return o; } catch (_) { /* salvage below */ }
      }
      const pick = k => { const m = t.match(new RegExp('"' + k + '"\\s*:\\s*"([^"]{0,300})"')); return m ? m[1] : undefined; };
      const u = pick('url'), title = pick('title');
      return (u || title) ? { url: u, title } : null;
    }

    // shadow-web's action map: { id, label, type, href, … }. Other browser
    // servers name things differently, so read it loosely.
    function actionKind(a) {
      const t = String(a.type || a.tag || a.role || '').toLowerCase();
      if (/input|text|search|email|password|textarea|combobox|select|field/.test(t)) return 'input';
      if (/button|submit|checkbox|radio|switch|tab|menuitem/.test(t)) return 'button';
      if (a.href || /link|anchor|^a$/.test(t)) return 'link';
      return 'button';
    }
    const sidOf = a => String(a.id ?? a.sid ?? a.ref ?? '');
    const labelOf = a => clip(a.label || a.text || a.name || a.placeholder || a.aria_label || '', 70);

    // ── page builders ──
    function frame(host, loading) {
      const p = el('div', 'abp' + (loading ? ' loading' : ''));
      p.style.setProperty('--h', hueOf(host || '?'));
      return p;
    }
    function topBar(host, navLinks) {
      const top = el('div', 'abp-top');
      top.append(el('div', 'abp-logo', (host || '?')[0]), el('div', 'abp-site', host));
      const nav = el('div', 'abp-navlinks');
      if (navLinks.length) navLinks.forEach(l => nav.append(el('span', null, l)));
      else for (let i = 0; i < 3; i++) { const s = el('span', 'abp-line'); s.style.cssText = 'width:52px;margin:0'; nav.append(s); }
      top.append(nav);
      return top;
    }
    function inputNode(label, secret) {
      const n = el('div', 'abp-input hit');
      n.append(el('span', 'val'), el('span', 'ph', label));
      if (secret) n.dataset.secret = '1';
      return n;
    }

    function buildSite(u, data) {
      const host = hostOf(u);
      const p = frame(host, !data);
      const actions = (data && Array.isArray(data.action_map) ? data.action_map : []).slice(0, 15);
      const navLinks = actions.filter(a => actionKind(a) === 'link').map(labelOf)
        .filter(l => l && l.length <= 16).slice(0, 4);
      p.append(topBar(host, navLinks));

      const hero = el('div', 'abp-hero');
      if (data && data.title) hero.append(el('h1', null, clip(data.title, 90)));
      else { const l = el('div', 'abp-line'); l.style.cssText = 'height:26px;width:62%;margin-bottom:16px'; hero.append(l); }
      lines(hero, 2, host.length);
      p.append(hero);

      const body = el('div', 'abp-body');
      if (actions.length) {
        actions.forEach((a, i) => {
          const kind = actionKind(a);
          const label = labelOf(a) || (kind === 'input' ? 'Type here' : 'Untitled');
          const node = kind === 'input'
            ? inputNode(label, /pass/i.test(String(a.type || '') + ' ' + label))
            : el('div', (kind === 'link' ? 'abp-link' : 'abp-btn') + ' hit', label);
          if (kind === 'input') node.classList.add('abp-wide');
          node.dataset.sid = sidOf(a);
          body.append(node);
          if (i % 5 === 4) { const t = el('div', 'abp-wide'); lines(t, 2, i); body.append(t); }
        });
      } else {
        for (let i = 0; i < 6; i++) { const c = el('div'); lines(c, 3, i + host.length); body.append(c); }
      }
      p.append(body);
      return p;
    }

    function buildSearch(query, data) {
      const engine = clip((data && data.engine) || 'search', 20);
      const p = frame(engine, !data);
      const bar = el('div', 'abp-sbar');
      const box = inputNode('Search the web', false);
      box.classList.add('focus');
      if (data) { box.querySelector('.val').textContent = clip(query, 80); box.querySelector('.ph').remove(); }
      bar.append(el('div', 'abp-logo', engine[0]), box);
      p.append(bar);

      const list = el('div', 'abp-results');
      const results = data && Array.isArray(data.results) ? data.results.slice(0, 8) : null;
      if (results && results.length) {
        results.forEach((r, i) => {
          const item = el('div', 'abp-result');
          const title = el('div', 'abp-r-title hit', clip(r.title || r.url || 'Result', 80));
          title.dataset.sid = String(r.sid ?? '');
          item.append(el('div', 'abp-r-url', pretty(r.url || '')), title);
          lines(item, 1, i);
          list.append(item);
        });
      } else if (results) {
        list.append(el('div', 'abp-r-url', (data && data.error) ? clip(data.error, 120) : 'No results.'));
      } else {
        for (let i = 0; i < 5; i++) {
          const item = el('div', 'abp-result');
          lines(item, 2, i);
          list.append(item);
        }
      }
      p.append(list);
      return p;
    }

    function buildError(u, msg) {
      const p = frame(hostOf(u), false);
      const box = el('div', 'abp-error');
      box.append(el('div', 'big', '⚠'), el('h1', null, "This page didn't load"), el('p', null, clip(msg, 220)));
      p.append(box);
      return p;
    }

    // ── the view ──
    function apply() {
      if (page) page.style.transform = `scale(${scale}) translateY(${-scroll}px)`;
    }
    function measure() {
      scale = Math.max(0.2, view.clientWidth / PAGE_W);
      if (page) { page.style.transition = 'none'; apply(); void page.offsetWidth; page.style.transition = ''; }
    }
    if (window.ResizeObserver) new ResizeObserver(measure).observe(view);

    function show(p) {
      const old = page;
      page = p;
      scroll = 0;
      p.style.transition = 'none';
      view.prepend(p);
      apply();
      void p.offsetWidth;
      p.style.transition = '';
      if (old) { old.classList.add('leaving'); setTimeout(() => old.remove(), 220); }
    }

    function progress(on) {
      prog.classList.remove('run', 'done');
      void prog.offsetWidth;
      prog.classList.add(on ? 'run' : 'done');
    }

    // The arrow's tip sits a few pixels into its box.
    function cursorTo(x, y) {
      cur = { x, y };
      cursor.classList.add('on');
      cursor.style.transform = `translate(${x - 4}px, ${y - 2}px)`;
    }
    function pointAt(node) {
      const v = view.getBoundingClientRect(), r = node.getBoundingClientRect();
      return { x: r.left - v.left + Math.min(r.width / 2, 40), y: r.top - v.top + r.height / 2 };
    }
    async function clickFx(node) {
      ripple.style.transform = `translate(${cur.x}px, ${cur.y}px)`;
      ripple.classList.remove('go');
      void ripple.offsetWidth;
      ripple.classList.add('go');
      if (node) {
        node.classList.add('pressed');
        await wait(170);
        node.classList.remove('pressed');
      }
    }
    // Scroll the page (a transform, like everything else) until `node` is
    // comfortably in view.
    async function reveal(node) {
      const viewH = view.clientHeight / scale;
      const top = node.offsetTop, bottom = top + node.offsetHeight;
      if (top >= scroll && bottom <= scroll + viewH - 16) return;
      const next = Math.max(0, Math.min(top - viewH * 0.35, page.offsetHeight - viewH));
      if (next === scroll) return;
      scroll = next;
      apply();
      await wait(520);
    }
    async function typeText(node, text, perChar) {
      const s = String(text || '');
      if (!shown() || pending > 2 || !s) { node.textContent = s; return; }
      const step = Math.max(1, Math.ceil(s.length / 45));   // long text types in chunks
      for (let i = step; i < s.length + step; i += step) {
        node.textContent = s.slice(0, i);
        await wait(perChar);
      }
    }
    // The element the agent named, or failing that something of the right
    // sort to point at, since the page may be one we couldn't describe.
    function targetFor(sid, selector) {
      if (!page) return null;
      const hits = [...page.querySelectorAll('.hit')];
      const exact = sid != null && hits.find(n => n.dataset.sid === String(sid));
      if (exact) return exact;
      const loose = [...page.querySelectorAll(selector)];
      return loose.length ? loose[Math.abs(hueOf(String(sid))) % loose.length] : null;
    }

    // ── steps ──
    async function typeAddress(text) {
      addr.classList.add('editing');
      await typeText(urlEl, text, 26);
      await wait(160);
      addr.classList.remove('editing');
    }
    async function goTo(u) {
      await typeAddress(pretty(u));
      url = u;
      progress(true);
      status('Loading ' + hostOf(u) + '…');
      cursor.classList.remove('on');
      show(buildSite(u, null));
    }
    function landed(u, data) {
      progress(false);
      if (u) { url = u; urlEl.textContent = pretty(u); }
      if (data && data.error && !data.title) {
        show(buildError(url, data.error));
        status("Couldn't load " + hostOf(url));
        return;
      }
      show(buildSite(url, data));
      status(clip((data && data.title) || hostOf(url), 90));
    }

    async function pointAndClick(node) {
      if (node) {
        await reveal(node);
        node.classList.add('target');
        const pt = pointAt(node);
        cursorTo(pt.x, pt.y);
        await wait(650);
        await clickFx(node);
        await wait(140);
        node.classList.remove('target');
      } else {
        cursorTo(view.clientWidth / 2, view.clientHeight / 2);
        await wait(650);
        await clickFx(null);
      }
    }

    function launchIcon() {
      const ic = document.getElementById('icon-browser');
      if (!ic || ic.hidden) return;
      ic.classList.remove('launch');
      void ic.offsetWidth;
      ic.classList.add('launch');
      setTimeout(() => ic.classList.remove('launch'), 800);
    }

    // ── what the chat stream calls ──
    // Only ever for a turn this tab started. Scheduled pings run on the
    // server's own thread and API calls (/v1/chat/completions) stream to
    // whoever made them; neither reaches here today, and sendBtn.disabled —
    // true only while this tab's own turn is streaming — keeps it that way if
    // one ever did.
    const ownTurn = () => sendBtn.disabled;

    function call(name, args) {
      const kind = kindOf(name || '');
      if (!kind || !ownTurn()) return;
      args = (args && typeof args === 'object') ? args : {};
      clearTimeout(closeTimer);
      if (win.hidden) {
        if (dismissed) return;          // closed during this turn: stay closed
        auto = true;
        touched = false;
        launchIcon();
        openApp('agent');
      }
      win.classList.add('working');

      if (kind === 'nav') {
        const u = String(args.url || '');
        if (u) queue(() => goTo(u));
      } else if (kind === 'search') {
        queue(async () => {
          lastQuery = String(args.query || '');
          await typeAddress('search?q=' + lastQuery);
          url = '';
          show(buildSearch(lastQuery, null));
          status('Searching “' + clip(lastQuery, 60) + '”');
          const box = page.querySelector('.abp-input');
          await pointAndClick(box);
          box.querySelector('.ph').remove();
          await typeText(box.querySelector('.val'), clip(lastQuery, 80), 32);
          progress(true);
        });
      } else if (kind === 'click') {
        queue(async () => {
          const node = targetFor(args.sid ?? args.ref ?? args.element, '.abp-link, .abp-btn, .abp-r-title');
          status('Clicking ' + (node ? '“' + clip(node.textContent, 50) + '”' : 'the page'));
          await pointAndClick(node);
        });
      } else if (kind === 'fill') {
        queue(async () => {
          const node = targetFor(args.sid ?? args.ref ?? args.element, '.abp-input');
          const value = String(args.value ?? args.text ?? '');
          const label = node && node.querySelector('.ph') ? node.querySelector('.ph').textContent : 'a field';
          status('Typing into “' + clip(label, 40) + '”');
          await pointAndClick(node);
          if (!node) return;
          node.classList.add('focus');
          const ph = node.querySelector('.ph');
          if (ph) ph.remove();
          const shownValue = node.dataset.secret ? '•'.repeat(Math.min(value.length, 16)) : clip(value, 80);
          await typeText(node.querySelector('.val'), shownValue, 45);
          await wait(200);
          node.classList.remove('focus');
        });
      } else {
        queue(async () => {
          if (args.url) await goTo(String(args.url));
          scan.classList.add('on');
          status(args.goal ? 'Working on: ' + clip(args.goal, 70) : 'Reading the page…');
        });
      }
    }

    function result(name, res) {
      const kind = kindOf(name || '');
      if (!kind || win.hidden || !ownTurn()) return;
      const data = parse(res);   // dropped once this step has drawn it
      queue(async () => {
        scan.classList.remove('on');
        if (kind === 'nav') {
          landed((data && data.url) || url, data);
        } else if (kind === 'search') {
          progress(false);
          show(buildSearch(lastQuery, data || { results: [] }));
          const n = data && Array.isArray(data.results) ? data.results.length : 0;
          status(n ? n + ' results' + (data.engine ? ' · ' + data.engine : '') : 'No results');
        } else if (kind === 'click' || kind === 'fill') {
          if (data && data.error) { status('Didn’t work: ' + clip(data.error, 70)); return; }
          // A click that went somewhere: the address changes and a page loads.
          // What's on it arrives with the next snapshot, if there is one.
          if (kind === 'click' && data && data.url && data.url !== url) {
            url = data.url;
            urlEl.textContent = pretty(url);
            progress(true);
            status('Loading ' + hostOf(url) + '…');
            show(buildSite(url, null));
            await wait(700);
            progress(false);
            show(buildSite(url, {}));
            status(hostOf(url));
          }
        } else if (data && Array.isArray(data.action_map)) {
          landed(data.url || url, data);
        } else if (data && data.error) {
          status('Didn’t work: ' + clip(data.error, 70));
        } else {
          status(url ? 'Read ' + hostOf(url) : 'Done reading');
        }
      });
    }

    function turnEnd() {
      dismissed = false;
      if (win.hidden) return;
      queue(async () => {
        scan.classList.remove('on');
        if (prog.classList.contains('run')) progress(false);
        await wait(400);
        cursor.classList.remove('on');
        win.classList.remove('working');
        status(url ? 'Done · ' + hostOf(url) : 'Done');
        // Opened by itself and never touched: tidy itself away again.
        if (auto && !touched) {
          clearTimeout(closeTimer);
          closeTimer = setTimeout(() => { if (!touched && !win.hidden) closeApp('agent'); }, 6000);
        }
      });
    }

    // Closing throws the page away, so an idle desktop holds nothing for it.
    function closed() {
      clearTimeout(closeTimer);
      if (sendBtn.disabled) dismissed = true;
      gen++;
      pending = 0;
      chain = Promise.resolve();
      setTimeout(() => {
        if (page) { page.remove(); page = null; }
        url = '';
        scroll = 0;
        urlEl.textContent = '';
        scan.classList.remove('on');
        prog.classList.remove('run', 'done');
        cursor.classList.remove('on');
        win.classList.remove('working');
        status('Waiting for the agent…');
      }, 160);
    }

    // Anyone who reaches in (drags it, clicks it) is keeping it.
    win.addEventListener('pointerdown', () => { touched = true; clearTimeout(closeTimer); });

    return { call, result, turnEnd, closed, setServers };
  })();

  syncThreadState();
  layoutIcons();
  // Web fonts change the label widths; settle once they're in.
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(scheduleLayout);

</script>
</body>
</html>
