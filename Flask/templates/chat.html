        const label = group.querySelector('.reasoning-label');
        if (label) label.textContent = 'see reasoning';
      }
    };
  }

  // ── Estimate total tokens for the FULL payload sent to/from the LLM ──
  // Walks the raw conversation array (system prompt, user/assistant text,
  // tool call arguments, and tool result content) rather than just what
  // gets rendered as visible bubbles, since all of that counts against
  // the context window / API usage.
  function estimateConversationTokens(conversation) {
    let total = 0;

    for (const msg of conversation) {
      // Role/structure overhead per message (rough, mirrors chat-template overhead)
      total += 4;

      if (msg.content) {
        if (typeof msg.content === 'string') {
          total += estimate(msg.content);
        } else if (Array.isArray(msg.content)) {
          for (const block of msg.content) {
            if (typeof block === 'string') {
              total += estimate(block);
            } else if (block && typeof block === 'object') {
              if (block.text) total += estimate(block.text);
              // Non-text blocks (images, etc.) still cost tokens; use a flat
              // estimate when we can't otherwise size them.
              else if (block.type && block.type !== 'text') total += 85;
            }
          }
        }
      }

      // Tool calls the assistant made: name + arguments JSON
      if (msg.tool_calls && msg.tool_calls.length > 0) {
        for (const tc of msg.tool_calls) {
          const fn = tc.function || {};
          total += estimate(fn.name || '');
          total += estimate(fn.arguments || '');
          total += 6; // per-call structural overhead (id, type, etc.)
        }
      }

      // Tool result messages: the data fed back to the LLM
      if (msg.role === 'tool') {
        total += estimate(msg.content || '');
        total += estimate(msg.name || '');
      }
    }

    return total;
  }

  // ── Pull an uploaded-file tag out of a message's text and, if it points
  // at an image, return the image URL so it can be re-rendered as a
  // bubble image (renderConversation() rebuilds bubbles from raw message
  // text, which is where sendMessage() embeds this tag).
  const FILE_TAG_RE = /^\[File uploaded: "(.*?)" → (.*?)\]\n?\n?/;
  const IMAGE_EXT_RE = /\.(png|jpe?g|gif|webp|bmp|svg)$/i;
  function extractFileTag(text) {
    const m = text.match(FILE_TAG_RE);
    if (!m) return { text, imageUrl: null };
    const path = m[2];
    return {
      text: text.slice(m[0].length),
      imageUrl: IMAGE_EXT_RE.test(path) ? path : null
    };
  }

  // ── Render full conversation returned by the agent ───────
  // opts.keepLiveUsage: don't recompute the token totals from the saved
  // messages. Set when re-rendering right after a turn we streamed, because
  // the live totals cover every request in that turn while a saved message
  // only records the one that produced it — recomputing there would silently
  // throw away the tool-call requests' share of the cost.
  function renderConversation(conversation, opts) {
    messagesEl.innerHTML = '';

    // Token estimate covers the ENTIRE payload (system + user + assistant
    // text + tool call args + tool results), not just visible bubbles. Only
    // used when the provider gave us nothing exact to show instead.
    totalTokens = estimateConversationTokens(conversation);
    if (!opts || !opts.keepLiveUsage) {
      // Real counts ride along on the assistant messages, so they survive a
      // reload rather than dropping back to the estimate. The last one that
      // has them is the current context size.
      const lastReported = [...conversation].reverse()
        .find(m => m.role === 'assistant' && m.usage);
      realUsage = lastReported ? {
        context: lastReported.usage.prompt_tokens,
        prompt: lastReported.usage.prompt_tokens,
        completion: lastReported.usage.completion_tokens,
        cached: lastReported.usage.cached_tokens,
        requests: 1,
        scope: 'message',
      } : null;
    }
    updateCount();

    // Index tool results by tool_call_id for quick lookup
    const toolResults = {};
    for (const msg of conversation) {
      if (msg.role === 'tool') {
        toolResults[msg.tool_call_id] = { content: msg.content, name: msg.name };
      }
    }

    // A sign-in card is still live only if the user hasn't spoken since.
    let lastUserIdx = -1;
    conversation.forEach((m, i) => { if (m.role === 'user') lastUserIdx = i; });

    for (const [i, msg] of conversation.entries()) {
      // Skip system messages and tool result messages (rendered inline)
      if (msg.role === 'system' || msg.role === 'tool') continue;

      if (msg.role === 'user') {
        // user content can be string or array
        const rawText = typeof msg.content === 'string'
          ? msg.content
          : (msg.content || []).filter(b => b.type === 'text').map(b => b.text).join('\n');
        const { text, imageUrl } = extractFileTag(rawText);
        addMessage('user', text, imageUrl, { countTokens: false });
      } else if (msg.role === 'assistant') {
        // Thinking first — it streamed ahead of everything else this message
        // produced, so it renders in the same order it was seen live.
        if (msg.reasoning) addReasoningBlock(msg.reasoning, false);
        // Tool calls next (if any)
        if (msg.tool_calls && msg.tool_calls.length > 0) {
          for (const tc of msg.tool_calls) {
            const fn = tc.function || {};
            const result = toolResults[tc.id];
            const resultText = result ? result.content : '(no result)';
            const isError = resultText && resultText.toLowerCase().startsWith('error');
            if (fn.name === 'request_sign_in' && !isError) {
              let target = '';
              try { target = (JSON.parse(fn.arguments || '{}') || {}).url || ''; } catch { /* malformed */ }
              if (target && addSignInCard(String(target), i > lastUserIdx)) continue;
            }
            addToolBlock(fn.name || tc.id, fn.arguments || '', resultText, isError);
          }
        }
        // Then the assistant's text reply (if any)
        const text = typeof msg.content === 'string'
          ? msg.content
          : (msg.content || []).filter(b => b.type === 'text').map(b => b.text).join('\n');
        if (text && text.trim()) {
          addMessage('agent', text, null,
                     { countTokens: false, provider: msg.provider, usage: msg.usage,
                       intent: msg.intent, sourced: msg.sourced });
        }
      }
    }

    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  // ── Live tool-call indicator (shown while a tool is running) ─────
  function addToolLive(name) {
    removeEmpty();
    const wrap = document.createElement('div');
    wrap.className = 'tool-group tool-live';
    const pill = document.createElement('div');
    pill.className = 'tool-toggle';
    pill.innerHTML = `<span class="tool-live-dot"></span><span class="tool-live-label">running tool: ${name}</span>`;
    wrap.appendChild(pill);
    messagesEl.appendChild(wrap);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return wrap;
  }

  function markToolLiveDone(wrap, name) {
    if (!wrap || !wrap.parentNode) return;
    wrap.classList.add('done');
    const label = wrap.querySelector('.tool-live-label');
    // Don't clobber the fallback "open <url>" link that open_url may
    // have inserted into the label when window.open() was blocked.
    if (label && !label.querySelector('a')) label.textContent = `ran tool: ${name}`;
  }

  // ── Sign-in request card ─────────────────────────────────
  // What a request_sign_in call draws instead of a tool pill, live and on
  // re-render alike — the saved tool call is the only record of it. `pending`
  // means nothing has been said since, so the agent is still waiting on the
  // user and the card offers to carry on; an older one is only a record.
  // Returns null for anything that isn't a web address, and the caller falls
  // back to the ordinary tool block.
  function addSignInCard(rawUrl, pending) {
    let url, host;
    try {
      const u = new URL(rawUrl.includes('://') ? rawUrl : 'https://' + rawUrl);
      if (u.protocol !== 'https:' && u.protocol !== 'http:') return null;
      url = u.href;
      host = u.hostname;
    } catch { return null; }
    removeEmpty();

    const wrap = document.createElement('div');
    wrap.className = 'tool-group approval signin' + (pending ? '' : ' past');

    const head = document.createElement('div');
    head.className = 'approval-head';
    head.textContent = 'sign-in needed';

    const hostEl = document.createElement('div');
    hostEl.className = 'signin-host';
    hostEl.textContent = host;     // textContent: the model chose this address

    const actions = document.createElement('div');
    actions.className = 'approval-actions';

    // A real link, opened by a real click, so no popup blocker gets a say —
    // and a new tab, because leaving this page would hang up a turn that may
    // still be streaming its last sentence.
    const q = new URLSearchParams({ url: url, from: 'chat' });
    if (currentUser) q.set('user', currentUser);
    const open = document.createElement('a');
    open.className = 'approval-btn primary';
    open.href = '/browser?' + q.toString();
    open.target = '_blank';
    open.rel = 'noopener';
    open.textContent = 'Sign in ↗';
    // On the desktop it opens in the Browser window instead. The href stays
    // real, so a middle-click or ctrl-click still gets a tab of its own.
    open.addEventListener('click', (e) => {
      if (e.button !== 0 || e.ctrlKey || e.metaKey || e.shiftKey || e.altKey) return;
      e.preventDefault();
      openApp('browser', { src: open.getAttribute('href') });
    });
    actions.appendChild(open);

    if (pending) {
      const done = document.createElement('button');
      done.className = 'approval-btn signin-continue';
      done.textContent = "I'm signed in — continue";
      done.addEventListener('click', () => {
        inputEl.value = `I've signed in to ${host} — carry on.`;
        // Mid-turn the send button is disabled; the text waits in the box.
        if (!sendBtn.disabled) sendMessage();
        else inputEl.focus();
      });
      actions.appendChild(done);
    }

    const note = document.createElement('div');
    note.className = 'approval-note';
    note.textContent = 'Opens a browser on the FreeClaw machine. Whatever you sign into there, '
      + 'the agent can use until you clear it on that page.';

    wrap.append(head, hostEl, actions, note);
    messagesEl.appendChild(wrap);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return wrap;
  }

  // The browser page announces each save. Flip any card still waiting so the
  // next step — telling the agent — is the obvious button.
  try {
    new BroadcastChannel('freeclaw-browser').onmessage = (e) => {
      const d = e.data || {};
      if (d.type !== 'saved' || (currentUser && d.user !== currentUser)) return;
      document.querySelectorAll('.signin:not(.past)').forEach((card) => {
        card.classList.add('saved');
        const open = card.querySelector('a.approval-btn');
        const cont = card.querySelector('.signin-continue');
        if (open && cont) { open.classList.remove('primary'); cont.classList.add('primary'); }
      });
    };
  } catch (e) { /* no BroadcastChannel: the continue button works regardless */ }

  // ── Bash approval prompt ─────────────────────────────────
  // The agent's turn is blocked server-side while this is on screen, so it
  // renders its own buttons rather than routing through the chat box. Posting
  // the answer is what releases the waiting turn.
  function addApprovalPrompt(evt) {
    removeEmpty();
    const wrap = document.createElement('div');
    wrap.className = 'tool-group approval';   // tool-group: width + fade-in
    wrap.dataset.id = evt.id;

    const head = document.createElement('div');
    head.className = 'approval-head';
    head.textContent = 'run this command?';

    const cmd = document.createElement('div');
    cmd.className = 'tool-code';
    cmd.textContent = evt.command;   // textContent, never innerHTML

    const actions = document.createElement('div');
    actions.className = 'approval-actions';

    const note = document.createElement('div');
    note.className = 'approval-note';
    note.textContent = 'Always-allow applies to you only, on this machine. '
      + 'Manage saved rules in Settings → Bash Approvals.';

    // "Always allow this exact command" is offered for anything; the broader
    // program-level rule only when the server says the command is simple
    // enough for one to be safe (evt.program is null otherwise).
    const choices = [
      { decision: 'once', label: 'allow once' },
      { decision: 'always_exact', label: 'always allow this command' },
    ];
    if (evt.program) {
      choices.push({ decision: 'always_program', label: `always allow all "${evt.program}" commands` });
    }
    choices.push({ decision: 'deny', label: 'deny', cls: 'deny' });

    const buttons = [];
    choices.forEach(c => {
      const btn = document.createElement('button');
      btn.className = 'approval-btn' + (c.cls ? ' ' + c.cls : '');
      btn.type = 'button';
      btn.textContent = c.label;
      btn.addEventListener('click', () => send(c.decision, c.label));
      actions.appendChild(btn);
      buttons.push(btn);
    });

    function settle(text) {
      buttons.forEach(b => { b.disabled = true; });
      actions.remove();
      note.remove();
      wrap.classList.add('settled');
      head.textContent = text;
    }

    async function send(decision, label) {
      buttons.forEach(b => { b.disabled = true; });
      try {
        const res = await fetch('/api/approval', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id: evt.id, decision })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || `Error ${res.status}`);
        settle(decision === 'deny' ? 'denied' : label);
      } catch (e) {
        // The prompt may have timed out while it sat on screen — say so
        // instead of leaving dead buttons behind.
        settle('could not answer: ' + e.message);
      }
    }

    wrap.appendChild(head);
    wrap.appendChild(cmd);
    wrap.appendChild(actions);
    wrap.appendChild(note);
    messagesEl.appendChild(wrap);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return { wrap, settle };
  }

  // ── Thinking indicator ───────────────────────────────────
  function addThinking() {
    removeEmpty();
    const wrap = document.createElement('div');
    wrap.className = 'message agent thinking';
    const label = document.createElement('div');
    label.className = 'msg-label';
    label.textContent = 'agent';
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div>';
    wrap.appendChild(label);
    wrap.appendChild(bubble);
    messagesEl.appendChild(wrap);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return wrap;
  }

  // ── File upload helpers ──────────────────────────────────

  function clearFile() {
    pendingFile = null;
    filePreview.classList.remove('visible');
    fileBar.style.width = '0%';
    fileInput.value = '';
  }

  uploadBtn.addEventListener('click', () => fileInput.click());
  fileRemove.addEventListener('click', clearFile);

  fileInput.addEventListener('change', async () => {
    const file = fileInput.files[0];
    if (!file) return;

    fileName.textContent = file.name;
    fileStatus.textContent = 'uploading…';
    fileBar.style.width = '0%';
    filePreview.classList.add('visible');
    uploading = true;
    sendBtn.disabled = true;

    requestAnimationFrame(() => { fileBar.style.width = '80%'; });

    try {
      const form = new FormData();
      form.append('file', file);
      const res  = await fetch('/upload', { method: 'POST', body: form });
      const data = await res.json();

      if (data.error) {
        fileStatus.textContent = 'error';
        fileBar.style.background = 'rgba(224,85,85,0.15)';
        fileBar.style.width = '100%';
        pendingFile = null;
      } else {
        fileBar.style.width = '100%';
        fileStatus.textContent = 'ready';
        pendingFile = { name: file.name, path: data.path, isImage: file.type.startsWith('image/') };
      }
    } catch {
      fileStatus.textContent = 'failed';
      pendingFile = null;
    }

    uploading = false;
    sendBtn.disabled = false;
    if (!isStandalone) inputEl.focus();
  });

  // ── Send ────────────────────────────────────────────────

  // Swaps the composer between "ready to send" and "a turn is running".
  // sendBtn.disabled stays the single source of truth for whether a turn is in
  // flight — the file-drop handler and the ping poller both already read it.
  function setBusy(busy) {
    sendBtn.disabled = busy;
    stopBtn.classList.toggle('visible', busy);
    sendBtn.style.display = busy ? 'none' : 'flex';
    // Re-armed per turn: it's disabled after a press to stop a second click
    // racing the first, and has to come back for the next turn.
    if (busy) stopBtn.disabled = false;
  }

  stopBtn.addEventListener('click', async () => {
    stopBtn.disabled = true;
    try {
      // Fire-and-forget by design. The turn winds down on its own schedule —
      // it has to reach a checkpoint where stopping leaves a valid
      // conversation — and the SSE stream reports the outcome. A 409 just
      // means it finished as the click landed, which needs no handling.
      await fetch('/api/stop', { method: 'POST' });
    } catch (_) {}
  });

  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text && !pendingFile) return;
    if (uploading) return;

    let agentMessage = text;
    let displayImageUrl = null;
    if (pendingFile) {
      const tag = `[File uploaded: "${pendingFile.name}" → ${pendingFile.path}]`;
      agentMessage = text ? `${tag}\n\n${text}` : tag;
      if (pendingFile.isImage) displayImageUrl = pendingFile.path;
    }

    inputEl.value = '';
    inputEl.style.height = 'auto';
    setBusy(true);
    inputEl.blur();
    clearFile();

    // Show the user's message immediately so it doesn't feel like it
    // vanished into the void while the agent is working. This is rendered
    // optimistically; renderConversation() will replace it (and recompute
    // token counts) once the real response comes back.
    addMessage('user', text, displayImageUrl);

    let thinking = addThinking();
    let liveWrap = null, liveBubble = null, liveText = '';
    let activeToolIndicator = null;
    let currentProvider = null;
    let currentIntent = null;
    let activeApproval = null;
    let activeReasoning = null;
    let activeMcp = null;       // the installed app the running tool belongs to

    // The thinking is over the moment anything else shows up — text, a tool
    // call, or the end of the turn. A turn with tool calls makes several LLM
    // requests, so it can open one of these per request, same as tool blocks.
    const finishReasoning = () => {
      if (activeReasoning) { activeReasoning.finish(); activeReasoning = null; }
    };

    const dropLiveBubble = () => {
      if (liveWrap) liveWrap.remove();
      liveWrap = null;
      liveBubble = null;
      liveText = '';
    };

    try {
      const res = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: agentMessage })
      });

      const contentType = res.headers.get('Content-Type') || '';

      // Slash-commands (and errors before streaming starts) come back as
      // plain JSON rather than an event-stream.
      if (!contentType.includes('text/event-stream')) {
        const data = await res.json();
        if (thinking.parentNode) thinking.remove();
        if (data.error) addMessage('agent', `**Error:** ${data.error}`);
        else if (data.conversation) renderConversation(data.conversation);
        else addMessage('agent', data.response || '');
        // Slash-commands can rewrite the conversation too (/reset clears it),
        // so re-baseline the poller here as well.
        syncUpdatedAt();
        setBusy(false);
        if (!isStandalone) inputEl.focus();
        return;
      }

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buf = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += decoder.decode(value, { stream: true });

        const chunks = buf.split('\n\n');
        buf = chunks.pop(); // keep any incomplete trailing chunk for next read

        for (const chunk of chunks) {
          const line = chunk.trim();
          if (!line.startsWith('data:')) continue;

          let evt;
          try { evt = JSON.parse(line.slice(5).trim()); } catch { continue; }

          if (evt.type === 'intent') {
            // Fires once per user turn, before the first token, so the label
            // reads the tag from the moment the reply starts rendering.
            currentIntent = evt.tag;
            if (liveWrap) updateLiveLabel(liveWrap, currentProvider, null, currentIntent);

          } else if (evt.type === 'provider') {
            // Fires once per LLM call — including every tool-call
            // continuation — so it also catches a mid-conversation fallback
            // switch, not just the provider used at the start of the turn.
            currentProvider = evt.name;
            // A new request starts here, so any token counts on the label
            // belong to the previous one — clear them rather than leave a
            // stale number attached to a different call.
            if (liveWrap) updateLiveLabel(liveWrap, currentProvider, null, currentIntent);

          } else if (evt.type === 'retry') {
            // A provider's stream broke before it produced anything, and the
            // turn is being handed to the next one. Any thinking on screen
            // belongs to that abandoned answer — remove it outright rather
            // than leave it above a reply it has nothing to do with. (Nothing
            // else can be up: the server only retries when no text and no tool
            // call made it out.)
            if (activeReasoning) { activeReasoning.wrap.remove(); activeReasoning = null; }
            if (!thinking.parentNode) thinking = addThinking();

          } else if (evt.type === 'reasoning') {
            // Arrives ahead of any text, so it stands in for the thinking
            // dots — the same "working on it" signal, with the work shown.
            if (thinking.parentNode) thinking.remove();
            if (!activeReasoning) activeReasoning = addReasoningBlock('', true);
            activeReasoning.append(evt.text);

          } else if (evt.type === 'token') {
            finishReasoning();
            if (thinking.parentNode) thinking.remove();
            if (!liveWrap) {
              liveWrap = document.createElement('div');
              liveWrap.className = 'message agent';
              const label = document.createElement('div');
              label.className = 'msg-label';
              label.textContent = agentLabelText(currentProvider, null, currentIntent);
              liveBubble = document.createElement('div');
              liveBubble.className = 'bubble';
              liveWrap.appendChild(label);
              liveWrap.appendChild(liveBubble);
              messagesEl.appendChild(liveWrap);
            }
            liveText += evt.text;
            liveBubble.innerHTML = marked.parse(liveText);
            messagesEl.scrollTop = messagesEl.scrollHeight;

          } else if (evt.type === 'tool_call') {
            // The model is about to run a tool — clear any in-progress
            // streamed text bubble (it'll be re-rendered properly, with the
            // full tool block, once the conversation comes back) and show
            // a live indicator so the user can see what's happening.
            finishReasoning();
            dropLiveBubble();
            if (thinking.parentNode) thinking.remove();
            activeToolIndicator = addToolLive(evt.name);
            agentBrowser.call(evt.name, evt.arguments);
            if (activeMcp) appUsage.stop(activeMcp);
            activeMcp = evt.mcp || null;
            if (activeMcp) appUsage.start(activeMcp);

            // open_url runs entirely client-side: the backend can't reach
            // the user's browser, so it just reports the url in
            // evt.arguments and leaves the actual opening to us. By the
            // time this event arrives we're deep inside an async fetch
            // stream, well outside the original click/keypress, so
            // browsers treat window.open() here as an untrusted popup
            // and silently block it. Fall back to a clickable link the
            // user can open themselves with a real click.
            // Drawn now rather than at the end of the turn so the button is
            // there while the model is still writing its sentence about it.
            // The re-render on 'done' replaces it with the saved-history copy.
            if (evt.name === 'request_sign_in') {
              const target = evt.arguments && evt.arguments.url;
              if (target) addSignInCard(String(target), true);
            }

            if (evt.name === 'open_url') {
              const target = evt.arguments && evt.arguments.url;
              if (target) {
                const win = window.open(target, '_blank', 'noopener,noreferrer');
                if (!win) {
                  const label = activeToolIndicator && activeToolIndicator.querySelector('.tool-live-label');
                  if (label) {
                    label.textContent = '';
                    const link = document.createElement('a');
                    link.href = target;
                    link.target = '_blank';
                    link.rel = 'noopener noreferrer';
                    link.textContent = `open ${target}`;
                    label.appendChild(link);
                  }
                }
              }
            }

          } else if (evt.type === 'approval_request') {
            // The turn is now blocked server-side until we post an answer.
            // Drop the thinking dots — nothing is happening until the user
            // decides — and show the command with its buttons.
            if (thinking.parentNode) thinking.remove();
            activeApproval = addApprovalPrompt(evt);

          } else if (evt.type === 'approval_resolved') {
            // Fires however the wait ended, including a timeout or another
            // tab answering first, so the card gets updated even when this
            // page wasn't what resolved it.
            if (activeApproval) {
              if (activeApproval.wrap.dataset.id === evt.id
                  && !activeApproval.wrap.classList.contains('settled')) {
                activeApproval.settle(evt.approved ? 'approved' : 'not run: ' + evt.decision);
              }
              activeApproval = null;
            }
            if (!thinking.parentNode) thinking = addThinking();

          } else if (evt.type === 'usage') {
            // Exact counts straight from the provider. Fires once per LLM
            // request, so on a turn with tool calls this arrives several
            // times — evt.turn carries the running totals for the whole turn.
            realUsage = {
              context: evt.context_tokens,
              prompt: evt.turn.prompt_tokens,
              completion: evt.turn.completion_tokens,
              cached: evt.turn.cached_tokens,
              requests: evt.turn.requests,
              scope: 'turn',
            };
            updateCount();
            if (liveWrap) updateLiveLabel(liveWrap, currentProvider, evt, currentIntent);

          } else if (evt.type === 'tool_result') {
            agentBrowser.result(evt.name, evt.result);
            if (activeMcp) { appUsage.stop(activeMcp); activeMcp = null; }
            if (activeToolIndicator) {
              markToolLiveDone(activeToolIndicator, evt.name);
              activeToolIndicator = null;
            }
            // The model still has to turn the tool result into a reply —
            // show the thinking dots again while that happens.
            if (!thinking.parentNode) thinking = addThinking();

          } else if (evt.type === 'error') {
            if (thinking.parentNode) thinking.remove();
            // Stop the pulse but leave the block: partial thinking is real
            // output the user watched arrive, and nothing re-renders after
            // an error to bring it back.
            finishReasoning();
            dropLiveBubble();
            if (activeToolIndicator) { activeToolIndicator.remove(); activeToolIndicator = null; }
            // An unanswered prompt can't be answered any more once the turn
            // has failed — take its buttons away rather than leaving them
            // there to post into nothing.
            if (activeApproval) {
              if (!activeApproval.wrap.classList.contains('settled')) activeApproval.settle('turn ended');
              activeApproval = null;
            }
            addMessage('agent', `**Error:** ${evt.error}`);

          } else if (evt.type === 'stopped') {
            // A 'done' always follows this (the server still saves the turn
            // and sends the final conversation), so there's nothing to render
            // here — just retire anything still animating, so the gap between
            // the two doesn't show a spinner for work that has already ended.
            finishReasoning();
            if (thinking.parentNode) thinking.remove();
            if (activeToolIndicator) { activeToolIndicator.remove(); activeToolIndicator = null; }
            if (activeApproval) {
              if (!activeApproval.wrap.classList.contains('settled')) activeApproval.settle('stopped');
              activeApproval = null;
            }
            stopBtn.disabled = true;

          } else if (evt.type === 'done') {
            if (thinking.parentNode) thinking.remove();
            // renderConversation() below rebuilds the thread from the saved
            // messages, reasoning blocks included — just drop the handle.
            activeReasoning = null;
            dropLiveBubble();
            if (activeToolIndicator) { activeToolIndicator.remove(); activeToolIndicator = null; }
            // renderConversation() below clears the whole thread, so the
            // approval card goes with it — just drop our handle on it.
            activeApproval = null;
            // Take the server's stamp for the save we just caused, so the
            // ping poller doesn't mistake our own turn for a background
            // update and re-render the thread from scratch.
            if (evt.updated_at != null) lastUpdatedAt = evt.updated_at;
            // keepLiveUsage: the totals we just streamed cover this whole
            // turn, including its tool-call requests. Rebuilding them from the
            // saved messages would drop back to the last request alone.
            renderConversation(evt.conversation, { keepLiveUsage: true });
          }
        }
      }

      if (thinking.parentNode) thinking.remove();
    } catch {
      if (thinking.parentNode) thinking.remove();
      finishReasoning();
      dropLiveBubble();
      if (activeToolIndicator) { activeToolIndicator.remove(); activeToolIndicator = null; }
      if (activeApproval) {
        if (!activeApproval.wrap.classList.contains('settled')) activeApproval.settle('connection lost');
        activeApproval = null;
      }
      addMessage('agent', '**Connection error.** Is the server running?');
    }

    agentBrowser.turnEnd();
    appUsage.stopAll();
    setBusy(false);
    if (!isStandalone) inputEl.focus();
  }

  sendBtn.addEventListener('click', sendMessage);
  inputEl.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });
  inputEl.addEventListener('input', () => {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 130) + 'px';
  });

  resetBtn.addEventListener('click', async () => {
    try { await fetch('/reset', { method: 'POST' }); } catch (_) {}
    syncUpdatedAt();  // the reset itself bumped updated_at — don't re-render on it
    clearFile();
    showEmptyState();
  });

  // ── Load the conversation this session is currently pointed at ───
  let lastUpdatedAt = null;

  // The MCP servers this user has, fetched once per load and again whenever
  // something that can change them closes or says so (the App Store, Settings,
  // an app window's switch). They drive the installed-app icons, and the
  // Browser icon — which is only any use once the shadow-web server is on
  // *and* its Chromium has finished downloading.
  let mcpAppsLoaded = false;
  async function refreshMcpApps() {
    mcpAppsLoaded = true;
    try {
      const res = await fetch('/api/mcp');
      if (!res.ok) return;
      renderMcpServers((await res.json()).servers || []);
    } catch (e) { /* the icons are a convenience; never break the chat over them */ }
  }

  function applyConversation(data) {
    if (data.user) currentUser = data.user;
    if (chatUserEl) chatUserEl.textContent = data.user || 'FreeClaw';
    if (data.user && !mcpAppsLoaded) refreshMcpApps();
    if (chatTitleEl) chatTitleEl.textContent = data.title || 'New chat';
    const msgs = data.messages || [];
    const hasVisible = msgs.some(m => m.role === 'user' || (m.role === 'assistant' && m.content));
    if (hasVisible) {
      renderConversation(msgs);
    } else {
      showEmptyState();
    }
  }

  (async function loadConversation() {
    try {
      const res = await fetch('/api/conversation');
      if (!res.ok) return;
      const data = await res.json();
      lastUpdatedAt = data.updated_at;
      applyConversation(data);
    } catch (_) { /* ignore — stay on empty state */ }
  })();

  // ── Pick up pings delivered while this tab is open ────────────────
  // A scheduled ping fires from a background thread on the server, outside
  // any request from this tab, so there's nothing that can push it to us —
  // poll a tiny endpoint instead and only pull the full conversation (and
  // re-render) once its updated_at actually moves.
  async function checkForUpdates() {
    if (sendBtn.disabled) return; // a live turn is streaming — don't clobber it
    try {
      const res = await fetch('/api/conversation/meta');
      if (!res.ok) return;
      const meta = await res.json();
      if (meta.updated_at == null || meta.updated_at === lastUpdatedAt) return;
      const full = await fetch('/api/conversation');
      if (!full.ok) return;
      const data = await full.json();
      // The user can hit send while these two fetches are in flight; re-check
      // before touching the DOM so we don't wipe their just-sent bubble and
      // the thinking dots out from under a turn that's already started.
      if (sendBtn.disabled) return;
      lastUpdatedAt = data.updated_at;
      applyConversation(data);
    } catch (_) { /* transient network hiccup — next tick will retry */ }
  }

  // Re-baseline after a change this tab caused itself (its own turn, /reset),
  // so the next poll doesn't treat our own write as a background update.
  async function syncUpdatedAt() {
    try {
      const res = await fetch('/api/conversation/meta');
      if (!res.ok) return;
      const meta = await res.json();
      if (meta.updated_at != null) lastUpdatedAt = meta.updated_at;
    } catch (_) { /* worst case the next poll re-renders — harmless */ }
  }

  setInterval(() => {
    if (document.visibilityState === 'visible') checkForUpdates();
  }, 8000);

  // Timers are throttled (iOS: suspended outright) while the page is
  // backgrounded, so a ping delivered with the phone locked would otherwise
  // sit unseen until the interval next gets a turn. Check the moment the tab
  // comes back instead of waiting on it.
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') checkForUpdates();
  });

  // ── files panel ───────────────────────────────────────────────────
  // Everything FreeClaw keeps for this user, one folder at a time: the saved
  // conversation, files/ (the agent's workspace — context.md and ping.md
  // pinned at the top, then everything it wrote or was sent) and history/
  // (conversations archived by /reset). Text files open in an editor, images
  // in a viewer, anything else says so. conversation.json and the archives
  // open read-only; the server enforces that and which files can't be
  // deleted, this only mirrors it. Saving files/context.md refreshes the
  // running conversation's system message on the way, so an edit lands on
  // the very next turn rather than waiting for a reset.
  const ctxBack      = document.getElementById('ctx-back');
  const ctxHeading   = document.getElementById('ctx-title');
  const ctxListView  = document.getElementById('ctx-list-view');
  const ctxListEl    = document.getElementById('ctx-list');
  const ctxListEmpty = document.getElementById('ctx-list-empty');
  const ctxFileView  = document.getElementById('ctx-file-view');
  const ctxText      = document.getElementById('ctx-text');
  const ctxImageWrap = document.getElementById('ctx-image-wrap');
  const ctxImage     = document.getElementById('ctx-image');
  const ctxBinary    = document.getElementById('ctx-binary');
  const ctxSave      = document.getElementById('ctx-save');
  const ctxDelete    = document.getElementById('ctx-delete');
  const ctxStatus    = document.getElementById('ctx-status');
  const ctxUserEl    = document.getElementById('ctx-user');

  const DIR_HINTS = {
    '': "Everything FreeClaw keeps for you.",
    'files': "The agent's files. It reads and writes these too.",
    'history': "Conversations archived by /reset. The agent can search these — delete any you don't want kept.",
  };
  const FILE_HINTS = {
    'conversation.json': "This conversation as saved. Read-only — /reset starts a new one.",
    'files/context.md': "Long-term memory. The agent edits this too.",
    'files/ping.md': "Scheduled pings, soonest first.",
  };
  const ARCHIVE_HINT = "An archived conversation. Read-only.";
  const dirHint = dir => DIR_HINTS[dir] || '';
  const fileHint = f => FILE_HINTS[f.name]
    || (f.name.startsWith('history/') ? ARCHIVE_HINT : '');
  const parentDir = path => path.includes('/') ? path.slice(0, path.lastIndexOf('/')) : '';
  const baseName = path => path.slice(path.lastIndexOf('/') + 1);

  let ctxDir      = '';      // folder being listed, relative to the user's folder
  let ctxOpenFile = null;    // { name, kind, protected, readonly } of the open file, or null
  let ctxOriginal = '';      // last known saved text, for the dirty check
  let ctxSaving   = false;
  let ctxBusy     = false;   // a delete is in flight

  function ctxSetStatus(msg, cls) {
    ctxStatus.textContent = msg;
    ctxStatus.className = cls || '';
  }

  const ctxDirty = () =>
    !!ctxOpenFile && ctxOpenFile.kind === 'text' && !ctxOpenFile.readonly
    && !ctxText.disabled && ctxText.value !== ctxOriginal;

  const ctxFileUrl = name =>
    '/api/users/' + encodeURIComponent(currentUser) + '/files/'
    + name.split('/').map(encodeURIComponent).join('/');

  function fmtSize(bytes) {
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024 * 1024) return Math.round(bytes / 1024) + ' KB';
    return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
  }

  const KIND_ICON = { text: '📄', image: '🖼', binary: '📦', dir: '📁' };

  // The user name normally arrives with the conversation on page load; ask for
  // it directly if the panel is opened before that landed (or if it failed).
  async function ctxResolveUser() {
    if (currentUser) return currentUser;
    try {
      const res = await fetch('/api/conversation');
      if (res.ok) {
        const data = await res.json();
        if (data.user) currentUser = data.user;
      }
    } catch (_) { /* reported by the caller */ }
    return currentUser;
  }

  // ── list view ──
  // `dir` is the folder to show; left out, it stays on the one already open.
  async function ctxShowList(status, dir) {
    if (dir !== undefined) ctxDir = dir;
    const listing = ctxDir;
    ctxOpenFile = null;
    ctxOriginal = '';
    ctxFileView.hidden = true;
    ctxListView.hidden = false;
    ctxBack.hidden = !listing;
    ctxSave.hidden = true;
    ctxDelete.hidden = true;
    ctxHeading.textContent = '/' + listing;
    // Drop the image so a closed panel isn't still holding it in memory.
    ctxImage.removeAttribute('src');
    ctxText.value = '';
    ctxSetStatus(status || dirHint(listing), status ? 'ok' : '');

    const user = await ctxResolveUser();
    ctxUserEl.textContent = user || '';
    ctxListEl.innerHTML = '';
    if (!user) {
      ctxListEmpty.hidden = false;
      ctxListEmpty.textContent = '';
      ctxSetStatus('No conversation selected — pick a user first.', 'err');
      return;
    }
    try {
      const res = await fetch('/api/users/' + encodeURIComponent(user) + '/files?dir='
                              + encodeURIComponent(listing));
      if (res.status === 404 && listing) {
        // The folder went away (history/ before the first reset, say) —
        // step back up rather than leave the panel on an error.
        return ctxShowList(undefined, parentDir(listing));
      }
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      // They may have moved on while this was in flight.
      if (ctxDir !== listing || ctxOpenFile) return;
      ctxRenderList(data.entries || []);
    } catch (e) {
      ctxListEmpty.hidden = false;
      ctxListEmpty.textContent = '';
      ctxSetStatus("Couldn't load the file list — " + e.message, 'err');
    }
  }

  function ctxRenderList(entries) {
    ctxListEl.innerHTML = '';
    ctxListEmpty.hidden = entries.length > 0;
    ctxListEmpty.textContent = entries.length ? ''
      : ctxDir === 'history' ? 'No archived conversations yet.' : 'Nothing here yet.';
    for (const f of entries) {
      const isDir = f.type === 'dir';
      const li  = document.createElement('li');
      const row = document.createElement('button');
      // Folders aren't coloured as protected — they're navigation, and the
      // accent is how the panel marks the files it won't let you delete.
      row.className = 'ctx-row' + (f.protected && !isDir ? ' protected' : '');
      row.type = 'button';

      const icon = document.createElement('span');
      icon.className = 'ctx-row-icon';
      icon.textContent = KIND_ICON[isDir ? 'dir' : f.kind] || '📄';

      const name = document.createElement('span');
      name.className = 'ctx-row-name';
      name.textContent = (f.label || baseName(f.name)) + (isDir ? '/' : '');

      const meta = document.createElement('span');
      meta.className = 'ctx-row-meta';
      meta.textContent = isDir
        ? f.count + (f.count === 1 ? ' item' : ' items')
        : fmtSize(f.size);

      row.append(icon, name, meta);
      row.addEventListener('click', () =>
        isDir ? ctxShowList(undefined, f.name) : ctxOpenFileView(f));
      li.appendChild(row);
      ctxListEl.appendChild(li);
    }
  }

  // ── one file ──
  async function ctxOpenFileView(f) {
    ctxOpenFile = f;
    ctxOriginal = '';
    ctxListView.hidden = true;
    ctxFileView.hidden = false;
    ctxBack.hidden = false;
    ctxHeading.textContent = '/' + f.name;
    ctxText.hidden = true;
    ctxText.readOnly = !!f.readonly;
    ctxImageWrap.hidden = true;
    ctxBinary.hidden = true;
    ctxSave.hidden = f.kind !== 'text' || !!f.readonly;
    ctxSave.disabled = true;
    ctxDelete.hidden = !!f.protected;
    ctxDelete.disabled = false;
    ctxSetStatus(fileHint(f), '');

    if (f.kind === 'image') {
      // Cache-bust so reopening after the agent rewrote the file shows the
      // new one rather than whatever the browser kept.
      ctxImage.src = ctxFileUrl(f.name) + '?raw=1&t=' + Date.now();
      ctxImage.alt = baseName(f.name);
      ctxImageWrap.hidden = false;
      if (!ctxStatus.textContent) ctxSetStatus(fmtSize(f.size) + ' image', '');
      return;
    }
    if (f.kind !== 'text') {
      ctxBinary.hidden = false;
      ctxBinary.textContent = "This one isn't text or an image, so there's "
        + "nothing to show here. " + fmtSize(f.size) + ".";
      return;
    }

    ctxText.hidden = false;
    ctxText.disabled = true;
    ctxText.value = '';
    ctxText.placeholder = 'Loading…';
    try {
      const res = await fetch(ctxFileUrl(f.name));
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      // They may have gone back or opened another file while this was in
      // flight — don't drop a stale file's text into the one that's open.
      if (!ctxOpenFile || ctxOpenFile.name !== f.name) return;
      ctxOriginal = data.content || '';
      ctxText.value = ctxOriginal;
      ctxText.placeholder = 'Empty — nothing in here yet.';
      ctxText.disabled = false;
    } catch (e) {
      if (!ctxOpenFile || ctxOpenFile.name !== f.name) return;
      ctxText.placeholder = '';
      ctxSetStatus("Couldn't open " + f.name + " — " + e.message, 'err');
    }
  }

  async function ctxDoSave() {
    if (ctxSaving || !currentUser || !ctxOpenFile
        || ctxOpenFile.kind !== 'text' || ctxText.disabled) return;
    const file = ctxOpenFile;
    ctxSaving = true;
    ctxSave.disabled = true;
    // The PUT takes this conversation's lock, which a streaming turn holds
    // until it finishes — say so rather than look hung.
    ctxSetStatus(sendBtn.disabled ? 'Saving — waiting for the current turn…' : 'Saving…', '');
    const sent = ctxText.value;
    try {
      const res = await fetch(ctxFileUrl(file.name), {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ content: sent })
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
      if (ctxOpenFile && ctxOpenFile.name === file.name) {
        ctxOriginal = sent;
        ctxSave.disabled = !ctxDirty();   // they may have typed on while it flew
        ctxSetStatus(file.name === 'files/context.md'
          ? 'Saved — the running conversation has it.' : 'Saved.', 'ok');
      }
      // Refreshing the system message rewrites the conversation, so a save to
      // context.md moves updated_at. Re-baseline the poll or it reads that
      // back as a background change and re-renders the thread underneath us.
      if (file.name === 'files/context.md') syncUpdatedAt();
    } catch (e) {
      ctxSetStatus('Save failed — ' + e.message, 'err');
      ctxSave.disabled = false;
    } finally {
      ctxSaving = false;
    }
  }

  async function ctxDoDelete() {
    if (ctxBusy || !ctxOpenFile || ctxOpenFile.protected || !currentUser) return;
    const file = ctxOpenFile;
    const what = file.label ? 'the conversation archived ' + file.label : file.name;
    if (!confirm('Delete ' + what + '? This cannot be undone.')) return;
    ctxBusy = true;
    ctxDelete.disabled = true;
    ctxSave.disabled = true;
    ctxSetStatus('Deleting…', '');
    try {
      const res = await fetch(ctxFileUrl(file.name), { method: 'DELETE' });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
      ctxOriginal = ctxText.value;   // nothing left to warn about losing
      ctxBusy = false;
      ctxShowList('Deleted ' + (file.label || baseName(file.name)) + '.', parentDir(file.name));
    } catch (e) {
      ctxSetStatus('Delete failed — ' + e.message, 'err');
      ctxDelete.disabled = false;
      ctxSave.disabled = !ctxDirty();
      ctxBusy = false;
    }
  }

  // ── open / close ──
  // The Files window's own lifecycle hooks, called by the window manager
  // below: a fresh list each time it opens, and a chance to keep unsaved
  // text before it closes.
  function ctxConfirmLeave() {
    return !ctxDirty()
      || confirm('Discard unsaved changes to ' + ctxOpenFile.name + '?');
  }

  // Opens on the user's folder — conversation.json, files/, history/ — rather
  // than straight into files/.
  function ctxOpen() {
    ctxShowList(undefined, '');
  }

  // One level up: an open file back to its folder's listing, a folder to its
  // parent. False when already at the top, so Escape knows to close instead.
  function ctxGoUp() {
    if (ctxOpenFile) {
      if (ctxConfirmLeave()) ctxShowList(undefined, parentDir(ctxOpenFile.name));
      return true;
    }
    if (ctxDir) { ctxShowList(undefined, parentDir(ctxDir)); return true; }
    return false;
  }

  function ctxClosePanel() {
    if (!ctxConfirmLeave()) return false;
    ctxImage.removeAttribute('src');
    ctxOpenFile = null;
    ctxOriginal = '';
    return true;
  }

  ctxBack.addEventListener('click', ctxGoUp);
  ctxSave.addEventListener('click', ctxDoSave);
  ctxDelete.addEventListener('click', ctxDoDelete);
  ctxText.addEventListener('input', () => {
    ctxSave.disabled = !ctxDirty();
    if (ctxStatus.className && ctxOpenFile) ctxSetStatus(fileHint(ctxOpenFile), '');
  });
  ctxText.addEventListener('keydown', e => {
    if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') { e.preventDefault(); ctxDoSave(); }
  });
  // Escape backs out one level at a time: open file → its folder → parent
  // folder → closed. Only while Files is the window in front.
  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape' || wm.focused !== 'files') return;
    if (!ctxGoUp()) closeApp('files');
  });
  // Nothing else on the page can move these files mid-edit except the agent
  // itself (add_context, edit_file), and clobbering that silently would lose
  // whatever it just wrote — so leaving with unsaved text asks first.
  window.addEventListener('beforeunload', e => {
    if (ctxDirty()) { e.preventDefault(); e.returnValue = ''; }
  });

  // Keep messages scrolled when iOS keyboard resizes the viewport
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', () => {
      messagesEl.scrollTop = messagesEl.scrollHeight;
      scheduleLayout();
    });
  }

  // ══ Desktop ═══════════════════════════════════════════════════════
  // Purely presentation: app icons on the wallpaper, apps in windows. Nothing
  // below talks to the server except by loading the Browser and Settings
  // pages into frames.

  const iconsEl   = document.getElementById('icons');
  const chatEl    = document.getElementById('chat');
  const inputArea = document.getElementById('input-area');
  const tasksEl   = document.getElementById('tasks');
  const clockEl   = document.getElementById('clock');
  const rootStyle = document.documentElement.style;

  // Small wrappers: storage can be missing or throw (private windows,
  // blocked site data), and nothing here is worth failing over.
  function loadPref(key) {
    try { return JSON.parse(localStorage.getItem(key) || 'null') || {}; } catch (_) { return {}; }
  }
  function savePref(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); } catch (_) { /* per-browser nicety only */ }
  }

  // ── Menu bar clock ──
  function tickClock() {
    clockEl.textContent = new Date().toLocaleString([], {
      weekday: 'short', hour: 'numeric', minute: '2-digit',
    });
  }
  tickClock();
  setInterval(tickClock, 15000);

  // ── Icons ──────────────────────────────────────────────────────────
  // Each icon has a home spot — scattered by default, or wherever it was last
  // dragged — stored as fractions of the desktop so it survives a resize.
  // When the thread grows over an icon, the icon steps aside into the margin
  // next to the chat column; when there's no margin wide enough (a phone),
  // all the icons line up in a row under the menu bar instead and the chat
  // column starts below them.
  const ICON_HOME = {
    browser:  [0.22, 0.20],
    files:    [0.76, 0.16],
    settings: [0.31, 0.50],
    home:     [0.69, 0.46],
    appstore: [0.77, 0.74],
  };
  // A phone has no room around the wallpaper mark, so the corners.
  const ICON_HOME_NARROW = {
    browser:  [0.20, 0.10],
    files:    [0.80, 0.14],
    settings: [0.22, 0.86],
    home:     [0.78, 0.82],
    appstore: [0.50, 0.93],
  };
  const iconPos = loadPref('fc-icon-pos');
  const ICON_GAP = 12;

  // Which remembered spot an icon uses. The built-in apps by app name;
  // installed apps by their server's name, since they all open the one
  // 'mcp' window.
  const iconKey = el => el.dataset.mcp ? 'mcp:' + el.dataset.mcp : el.dataset.app;

  // Where an installed app sits until it's dragged somewhere: down the two
  // side edges, alternating, away from the built-in apps in the middle. A
  // phone gets rows in the gap between the wallpaper mark and the bottom icons.
  function mcpHome(i, narrow) {
    if (narrow) return [0.14 + (i % 4) * 0.24, 0.63 + Math.floor(i / 4) * 0.13];
    const right = i % 2 === 1;
    const n = Math.floor(i / 2);
    const col = Math.floor(n / 5);
    return [right ? 0.95 - col * 0.08 : 0.05 + col * 0.08, 0.08 + (n % 5) * 0.2];
  }

  const iconEls = () => [...iconsEl.querySelectorAll('.app-icon')].filter(el => !el.hidden);

  function setIconXY(el, x, y) {
    el._x = x; el._y = y;
    el.style.transform = `translate(${Math.round(x)}px, ${Math.round(y)}px)`;
  }

  const overlaps = (a, b, pad) =>
    a.x < b.x + b.w + pad && a.x + a.w + pad > b.x &&
    a.y < b.y + b.h + pad && a.y + a.h + pad > b.y;

  let layoutQueued = false;
  function scheduleLayout() {
    if (layoutQueued) return;
    layoutQueued = true;
    requestAnimationFrame(() => { layoutQueued = false; layoutIcons(); });
  }

  function layoutIcons() {
    const icons = iconEls();
    if (!icons.length) return;
    const topbarH = document.getElementById('topbar').offsetHeight;
    const W = window.innerWidth;
    const iw = icons[0].offsetWidth || 86;
    const hasThread = document.body.classList.contains('thread');
    const colW = chatEl.offsetWidth;
    const gutter = (W - colW) / 2;
    const stepAside = gutter >= iw + 16;

    // No room beside the column: a tidy row under the menu bar, and the chat
    // column starts beneath it so nothing is ever underneath the thread.
    const strip = hasThread && !stepAside;
    icons.forEach(el => el.classList.toggle('compact', strip));
    if (strip) {
      // As many rows as it takes: installed apps can outnumber what fits
      // across a phone.
      const w = icons[0].offsetWidth, h = icons[0].offsetHeight;
      const gap = 6;
      const perRow = Math.max(1, Math.floor((W - 16 + gap) / (w + gap)));
      const rows = Math.ceil(icons.length / perRow);
      icons.forEach((el, i) => {
        const row = Math.floor(i / perRow);
        const inRow = Math.min(perRow, icons.length - row * perRow);
        const total = inRow * w + (inRow - 1) * gap;
        const x = Math.max(8, (W - total) / 2) + (i % perRow) * (w + gap);
        setIconXY(el, x, topbarH + 6 + row * (h + 4));
      });
      rootStyle.setProperty('--chat-top', (topbarH + rows * (h + 4) + 6) + 'px');
      return;
    }
    rootStyle.setProperty('--chat-top', 'var(--topbar-h)');

    const ih = icons[0].offsetHeight;
    const b = {
      left: 8, right: W - 8,
      top: topbarH + 10,
      bottom: inputArea.getBoundingClientRect().top - 10,
    };
    const clampX = x => Math.min(Math.max(x, b.left), b.right - iw);
    const clampY = y => Math.min(Math.max(y, b.top), Math.max(b.top, b.bottom - ih));

    // Home spots first.
    const defaults = W < 720 ? ICON_HOME_NARROW : ICON_HOME;
    let mcpIndex = 0;
    const placed = icons.map(el => {
      const key = iconKey(el);
      const slot = el.dataset.mcp ? mcpIndex++ : 0;
      const [fx, fy] = iconPos[key] || defaults[key]
        || (el.dataset.mcp ? mcpHome(slot, W < 720) : [0.5, 0.5]);
      return {
        el,
        x: clampX(b.left + fx * (b.right - b.left) - iw / 2),
        y: clampY(b.top + fy * (b.bottom - b.top) - ih / 2),
        w: iw, h: ih,
      };
    });

    // Then out of the thread's way: into the margin on whichever side of the
    // column the icon was already nearer.
    if (hasThread) {
      const col = chatEl.getBoundingClientRect();
      const msg = messagesEl.getBoundingClientRect();
      const thread = { x: col.left, y: msg.top, w: col.width, h: b.bottom - msg.top + 10 };
      for (const p of placed) {
        if (!overlaps(p, thread, ICON_GAP)) continue;
        p.x = (p.x + iw / 2 < W / 2)
          ? Math.max(b.left, col.left - iw - 18)
          : Math.min(b.right - iw, col.right + 18);
      }
    }

    // Finally, no two icons on top of each other: sweep top to bottom pushing
    // later ones down, and if that runs off the bottom, back up again.
    placed.sort((a, c) => a.y - c.y);
    for (let pass = 0; pass < 3; pass++) {
      for (let i = 0; i < placed.length; i++) {
        for (let j = 0; j < i; j++) {
          const a = placed[j], c = placed[i];
          if (overlaps(a, c, 4)) c.y = a.y + a.h + 8;
        }
        if (placed[i].y > b.bottom - ih) {
          placed[i].y = b.bottom - ih;
          for (let j = i - 1; j >= 0; j--) {
            const a = placed[j], c = placed[j + 1];
            if (overlaps(a, c, 4)) a.y = Math.max(b.top, c.y - a.h - 8);
          }
        }
      }
    }
    placed.forEach(p => setIconXY(p.el, p.x, p.y));
  }

  // Whether there's a thread to make room for. showEmptyState() leaves only
  // the #empty-state marker behind; anything else means a conversation.
  function syncThreadState() {
    const has = [...messagesEl.children].some(c => c.id !== 'empty-state');
    if (document.body.classList.contains('thread') !== has) {
      document.body.classList.toggle('thread', has);
    }
    scheduleLayout();
  }
  new MutationObserver(syncThreadState).observe(messagesEl, { childList: true });
  if (window.ResizeObserver) {
    // The thread climbing as replies stream in, the composer growing a line.
    const ro = new ResizeObserver(scheduleLayout);
    ro.observe(messagesEl);
    ro.observe(inputArea);
  }
  window.addEventListener('resize', () => { scheduleLayout(); clampAllWindows(); });

  // Click selects, double-click opens — a tap opens straight away on touch.
  // Drag to move; the new spot is remembered in this browser.
  function selectIcon(el) {
    iconsEl.querySelectorAll('.app-icon.selected').forEach(i => { if (i !== el) i.classList.remove('selected'); });
    if (el) el.classList.add('selected');
  }
  document.getElementById('desktop').addEventListener('pointerdown', e => {
    if (!e.target.closest('.app-icon') && !e.target.closest('#chat > *')) selectIcon(null);
  });

  // Opening an icon: an installed app opens the shared app window on itself.
  const openIcon = el => openApp(el.dataset.app, el.dataset.mcp ? { mcp: el.dataset.mcp } : undefined);

  iconsEl.querySelectorAll('.app-icon').forEach(wireIcon);

  function wireIcon(el) {
    let start = null;   // { px, py, x, y, pointerType } while pressed
    let moved = false;

    el.addEventListener('pointerdown', e => {
      if (e.button !== 0) return;
      start = { px: e.clientX, py: e.clientY, x: el._x || 0, y: el._y || 0, type: e.pointerType };
      moved = false;
      el.setPointerCapture(e.pointerId);
    });
    el.addEventListener('pointermove', e => {
      if (!start) return;
      const dx = e.clientX - start.px, dy = e.clientY - start.py;
      if (!moved && Math.hypot(dx, dy) < 5) return;
      moved = true;
      el.classList.add('dragging');
      el.style.transform = `translate(${start.x + dx}px, ${start.y + dy}px)`;
    });
    const release = e => {
      if (!start) return;
      const s = start;
      start = null;
      el.classList.remove('dragging');
      if (!moved) {
        if (s.type === 'touch' || s.type === 'pen') openIcon(el);
        else selectIcon(el);
        return;
      }
      // Remember the drop point as the new home. layoutIcons() re-clamps it
      // and steps it aside again if it was dropped on the thread.
      const topbarH = document.getElementById('topbar').offsetHeight;
      const top = topbarH + 10, bottom = inputArea.getBoundingClientRect().top - 10;
      const x = s.x + (e.clientX - s.px), y = s.y + (e.clientY - s.py);
      iconPos[iconKey(el)] = [
        Math.min(1, Math.max(0, (x + el.offsetWidth / 2 - 8) / (window.innerWidth - 16))),
        Math.min(1, Math.max(0, (y + el.offsetHeight / 2 - top) / Math.max(1, bottom - top))),
      ];
      savePref('fc-icon-pos', iconPos);
      selectIcon(el);
      layoutIcons();
    };
    el.addEventListener('pointerup', release);
    el.addEventListener('pointercancel', release);
    el.addEventListener('dblclick', () => { if (!moved) openIcon(el); });
    el.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openIcon(el); }
    });
  }

  // ── Windows ────────────────────────────────────────────────────────
  const APPS = {
    // 705 tall so the page, under the window bar and the browser's own
    // toolbar, comes out at the remote viewport's 16:10 with no letterbox.
    browser:  { w: 1000, h: 705, src: () => '/browser' + (currentUser ? '?user=' + encodeURIComponent(currentUser) : '') },
    settings: { w: 820,  h: 660, src: () => '/settings' },
    appstore: { w: 940,  h: 700, src: () => '/appstore' },
    mcp:      { w: 380,  h: 360 },
    // Up in the top-right corner, out of the thread's way.
    agent:    { w: 540,  h: 400, place: d => ({ w: 540, h: 400, x: d.width - 540 - 18, y: 14 }),
                onClose: () => { agentBrowser.closed(); return true; } },
    files:    { w: 520,  h: 560, onOpen: ctxOpen, onClose: ctxClosePanel },
  };
  const wm = { z: 20, focused: null, order: [] };   // order: open apps, oldest first
  const winGeo = loadPref('fc-win-geo');
  const winEl = app => document.getElementById('win-' + app);
  const isOpen = app => { const w = winEl(app); return !!w && !w.hidden; };
  const deskRect = () => document.getElementById('windows').getBoundingClientRect();

  function placeWindow(win, g) {
    const d = deskRect();
    const w = Math.min(Math.max(g.w, 300), d.width - 16);
    const h = Math.min(Math.max(g.h, 200), d.height - 16);
    // Keep at least the title bar somewhere it can be grabbed.
    const x = Math.min(Math.max(g.x, 80 - w), d.width - 80);
    const y = Math.min(Math.max(g.y, 0), d.height - 36);
    Object.assign(win.style, { left: x + 'px', top: y + 'px', width: w + 'px', height: h + 'px' });
  }

  function currentGeo(win) {
    return { x: win.offsetLeft, y: win.offsetTop, w: win.offsetWidth, h: win.offsetHeight };
  }

  function rememberGeo(app) {
    const win = winEl(app);
    if (!win || win.hidden || win.classList.contains('max') || window.innerWidth < 720) return;
    winGeo[app] = currentGeo(win);
    savePref('fc-win-geo', winGeo);
  }

  function clampAllWindows() {
    if (window.innerWidth < 720) return;   // phones: CSS makes every window full-screen
    document.querySelectorAll('.win:not([hidden]):not(.max)').forEach(win => placeWindow(win, currentGeo(win)));
  }

  function focusApp(app) {
    const win = winEl(app);
    if (!win || win.hidden) return;
    win.style.zIndex = ++wm.z;
    document.querySelectorAll('.win.focused').forEach(w => { if (w !== win) w.classList.remove('focused'); });
    win.classList.add('focused');
    wm.focused = app;
    renderTasks();
  }

  // Hand focus to whichever visible window is on top, if any.
  function focusTopmost() {
    const top = [...document.querySelectorAll('.win:not([hidden]):not(.minimized):not(.closing)')]
      .sort((a, b) => (+b.style.zIndex || 0) - (+a.style.zIndex || 0))[0];
    document.querySelectorAll('.win.focused').forEach(w => w.classList.remove('focused'));
    wm.focused = null;
    if (top) focusApp(top.dataset.app); else renderTasks();
  }

  function ensureFrame(app, src) {
    const body = winEl(app).querySelector('.win-body');
    let frame = body.querySelector('iframe');
    if (!frame) {
      frame = document.createElement('iframe');
      frame.title = app;
      body.appendChild(frame);
      frame.src = src || APPS[app].src();
    } else if (src) {
      frame.src = src;
    }
  }

  function openApp(app, opts) {
    opts = opts || {};
    if (app === 'home') {
      document.body.classList.add('leaving');
      setTimeout(() => { window.location.href = '/'; }, 180);
      return;
    }
    const spec = APPS[app];
    const win = winEl(app);
    if (!spec || !win) return;
    selectIcon(null);
    if (app === 'mcp') {
      if (!opts.mcp && !mcpWindow.name) return;
      if (opts.mcp) mcpWindow.show(opts.mcp);
    }

    if (spec.src) ensureFrame(app, opts.src);

    if (win.hidden) {
      const d = deskRect();
      const n = wm.order.length;
      const g = winGeo[app] || (spec.place && spec.place(d)) || {
        w: spec.w, h: spec.h,
        x: (d.width - Math.min(spec.w, d.width - 16)) / 2 + n * 26,
        y: Math.max(12, (d.height - Math.min(spec.h, d.height - 16)) / 2 - 40) + n * 26,
      };
      win.hidden = false;
      win.classList.remove('minimized', 'closing');
      placeWindow(win, g);
      win.classList.remove('opening');
      void win.offsetWidth;          // restart the open animation
      win.classList.add('opening');
      wm.order.push(app);
      if (spec.onOpen) spec.onOpen();
    } else if (win.classList.contains('minimized')) {
      win.classList.remove('minimized');
      win.classList.remove('opening');
      void win.offsetWidth;
      win.classList.add('opening');
    }
    focusApp(app);
  }

  function closeApp(app) {
    const spec = APPS[app];
    const win = winEl(app);
    if (!win || win.hidden) return;
    if (spec.onClose && spec.onClose() === false) return;
    rememberGeo(app);
    win.classList.remove('opening');
    win.classList.add('closing');
    wm.order = wm.order.filter(a => a !== app);
    setTimeout(() => {
      win.hidden = true;
      win.classList.remove('closing', 'focused', 'max');
      // Frames go with the window, like closing a tab: the Browser page stops
      // streaming frames and Settings starts fresh next time.
      const frame = win.querySelector('.win-body iframe');
      if (frame) frame.remove();
      if ((app === 'settings' || app === 'appstore') && currentUser) {
        // Either may have added, removed or switched off a server — the
        // browser included.
        refreshMcpApps();
      }
      if (app === 'mcp') mcpWindow.name = null;
      const wt = win.querySelector('.wt-text');
      if (wt) { wt.textContent = APP_LABEL[app]; wt.classList.remove('page'); }
    }, 140);
    if (wm.focused === app) wm.focused = null;
    focusTopmost();
  }

  function minimizeApp(app) {
    const win = winEl(app);
    if (!win || win.hidden) return;
    win.classList.add('minimized');
    win.classList.remove('focused');
    if (wm.focused === app) wm.focused = null;
    focusTopmost();
  }

  function toggleMaxApp(app) {
    const win = winEl(app);
    if (!win || window.innerWidth < 720) return;
    if (!win.classList.contains('max')) rememberGeo(app);
    win.classList.toggle('max');
    focusApp(app);
  }

  // ── Menu bar task pills ──
  const APP_LABEL = { browser: 'Browser', files: 'Files', settings: 'Settings', agent: 'Agent browser',
                      appstore: 'App Store' };
  function renderTasks() {
    tasksEl.innerHTML = '';
    for (const app of wm.order) {
      const win = winEl(app);
      const btn = document.createElement('button');
      const min = win.classList.contains('minimized');
      btn.className = 'task' + (wm.focused === app && !min ? ' active' : '') + (min ? ' minimized' : '');
      btn.type = 'button';
      const label = app === 'mcp' ? (mcpWindow.name || 'App') : APP_LABEL[app];
      btn.title = label;
      btn.innerHTML = `<svg><use href="#i-${app}"/></svg><span></span>`;
      btn.querySelector('span').textContent = label;
      btn.addEventListener('click', () => {
        if (min) openApp(app);
        else if (wm.focused === app) minimizeApp(app);
        else focusApp(app);
      });
      tasksEl.appendChild(btn);
    }
  }

  // ── Dragging, resizing, focusing ──
  document.querySelectorAll('.win').forEach(win => {
    const app = win.dataset.app;
    const bar = win.querySelector('.win-bar');
    const grip = win.querySelector('.win-resize');

    win.addEventListener('pointerdown', () => { if (wm.focused !== app) focusApp(app); }, true);
    win.querySelector('.wl.close').addEventListener('click', () => closeApp(app));
    win.querySelector('.wl.min').addEventListener('click', () => minimizeApp(app));
    win.querySelector('.wl.max').addEventListener('click', () => toggleMaxApp(app));
    bar.addEventListener('dblclick', e => { if (!e.target.closest('.wl')) toggleMaxApp(app); });

    // One pointer-capture helper serves both the title bar and the grip.
    function track(handle, cls, onMove) {
      handle.addEventListener('pointerdown', e => {
        if (e.button !== 0 || e.target.closest('.wl')) return;
        if (win.classList.contains('max') || window.innerWidth < 720) return;
        e.preventDefault();
        const g0 = currentGeo(win), px = e.clientX, py = e.clientY;
        handle.setPointerCapture(e.pointerId);
        document.body.classList.add(cls);
        const move = ev => onMove(g0, ev.clientX - px, ev.clientY - py);
        const up = () => {
          document.body.classList.remove(cls);
          handle.removeEventListener('pointermove', move);
          handle.removeEventListener('pointerup', up);
          handle.removeEventListener('pointercancel', up);
          rememberGeo(app);
        };
        handle.addEventListener('pointermove', move);
        handle.addEventListener('pointerup', up);
        handle.addEventListener('pointercancel', up);
      });
    }
    track(bar, 'wm-drag', (g, dx, dy) => placeWindow(win, { ...g, x: g.x + dx, y: g.y + dy }));
    track(grip, 'wm-resize', (g, dx, dy) => placeWindow(win, { ...g, w: g.w + dx, h: g.h + dy }));
  });

  // A click inside a framed app never reaches this page, but it does take
  // focus away from it — which is how we know to raise that window.
  window.addEventListener('blur', () => {
    setTimeout(() => {
      const f = document.activeElement;
      if (f && f.tagName === 'IFRAME') {
        const win = f.closest('.win');
        if (win && wm.focused !== win.dataset.app) focusApp(win.dataset.app);
      }
    }, 0);
  });

  // Framed pages ask for another app rather than navigating inside their
  // own window (Settings' "open browser →", say).
  // They also report presses, since moving between two frames doesn't blur
  // this page and so the trick above can't see it.
  window.addEventListener('message', e => {
    if (e.origin !== location.origin) return;
    const d = e.data || {};
    if (d.type === 'freeclaw-open' && (APPS[d.app] || d.app === 'home') && d.app !== 'mcp') {
      openApp(d.app, { src: d.src });
    } else if (d.type === 'freeclaw-title') {
      // The Browser shows the page it's on in the window's title, as Chrome
      // does on its tab.
      const frame = [...document.querySelectorAll('.win iframe')].find(f => f.contentWindow === e.source);
      const t = frame && frame.closest('.win').querySelector('.wt-text');
      if (t) {
        const title = String(d.title || '').slice(0, 120);
        t.textContent = title || APP_LABEL[frame.closest('.win').dataset.app];
        t.classList.toggle('page', !!title);
      }
    } else if (d.type === 'freeclaw-mcp-changed') {
      refreshMcpApps();
    } else if (d.type === 'freeclaw-focus') {
      const frame = [...document.querySelectorAll('.win iframe')].find(f => f.contentWindow === e.source);
      const win = frame && frame.closest('.win');
      if (win && wm.focused !== win.dataset.app) focusApp(win.dataset.app);
    }
  });

  // ── Installed apps ─────────────────────────────────────────────────
  // Every server added through the App Store (or Settings) is an icon on
  // the desktop: the vendor's icon, or its first letter; greyed out while
  // it's switched off for this user; glowing while the agent is using it.
  // Double-clicking one opens the app window, whose only job is on/off —
  // removing an app is done from the App Store.
  let mcpServers = [];
  const homeIcon = document.getElementById('icon-home');
  const mcpIconEl = name => [...iconsEl.querySelectorAll('.app-icon.mcp-app')].find(el => el.dataset.mcp === name);

  function mcpHue(name) {
    let h = 0;
    for (const ch of String(name || '')) h = (h * 31 + ch.charCodeAt(0)) % 360;
    return h;
  }

  function mcpHost(s) {
    if (s.site) return s.site;
    try { return new URL(s.url).hostname; } catch (_) { return ''; }
  }

  // Fill a tile with the app's icon, falling back to its first letter if
  // there's no site to ask or the site has no icon. `holder` gets the
  // `letter` class so its tile can take on the name's tint.
  function fillAppIcon(tile, holder, s) {
    const letter = () => {
      tile.innerHTML = '';
      holder.classList.add('letter');
      const span = document.createElement('span');
      span.className = 'app-letter';
      span.textContent = (String(s.name).trim()[0] || '?');
      tile.appendChild(span);
    };
    holder.style.setProperty('--h', mcpHue(s.name));
    holder.classList.remove('letter');
    tile.innerHTML = '';
    const host = mcpHost(s);
    if (!host) return letter();
    const img = document.createElement('img');
    img.alt = '';
    img.draggable = false;
    img.onerror = letter;
    img.src = '/api/appstore/icon?host=' + encodeURIComponent(host);
    tile.appendChild(img);
  }

  function renderMcpServers(servers) {
    mcpServers = servers;
    agentBrowser.setServers(servers.filter(s => s.browser).map(s => s.name));

    const browserIcon = document.getElementById('icon-browser');
    const ready = servers.some(s => s.browser && s.enabled !== false && s.browser.status === 'ready');
    let changed = false;
    if (browserIcon && browserIcon.hidden === ready) { browserIcon.hidden = !ready; changed = true; }

    // Builtins aren't "installed" — the browser already has its own icon.
    const apps = servers.filter(s => !s.builtin);
    const want = new Set(apps.map(s => s.name));
    iconsEl.querySelectorAll('.app-icon.mcp-app').forEach(el => {
      if (!want.has(el.dataset.mcp)) { el.remove(); changed = true; }
    });
    for (const s of apps) {
      let el = mcpIconEl(s.name);
      if (!el) {
        el = document.createElement('button');
        el.className = 'app-icon mcp-app';
        el.dataset.app = 'mcp';
        el.dataset.mcp = s.name;
        el.innerHTML = '<span class="app-tile"></span><span class="app-label"></span>';
        el.querySelector('.app-label').textContent = s.name;
        iconsEl.insertBefore(el, homeIcon);
        wireIcon(el);
        if (appUsage.active(s.name)) el.classList.add('using');
        changed = true;
      }
      const on = s.enabled !== false;
      el.title = s.name + (on ? '' : ' (off)');
      el.classList.toggle('off', !on);
      // Refetched only when where it comes from changes, not on every toggle.
      const iconFrom = mcpHost(s);
      if (el.dataset.iconFrom !== iconFrom) {
        el.dataset.iconFrom = iconFrom;
        fillAppIcon(el.querySelector('.app-tile'), el, s);
      }
    }
    if (changed) layoutIcons();
    mcpWindow.sync();
  }

  const mcpWindow = (() => {
    const win    = winEl('mcp');
    const root   = win.querySelector('.mw');
    const iconEl = root.querySelector('.mw-icon');
    const nameEl = root.querySelector('.mw-name');
    const subEl  = root.querySelector('.mw-sub');
    const status = root.querySelector('.mw-status');
    const onBtn  = root.querySelector('.on-btn');
    const offBtn = root.querySelector('.off-btn');
    const msgEl  = root.querySelector('.mw-msg');
    const note   = root.querySelector('.mw-note');
    const title  = win.querySelector('.mw-title');
    let busy = false;

    const self = {
      name: null,
      show(name) {
        if (self.name !== name) msgEl.textContent = '';
        self.name = name;
        const s = mcpServers.find(x => x.name === name);
        if (!s) return;
        fillAppIcon(iconEl, iconEl, s);
        self.sync();
        renderTasks();
      },
      // Redraw from the current server list — after a toggle, a refresh, or a
      // tool call starting or finishing.
      sync() {
        if (!self.name) return;
        const s = mcpServers.find(x => x.name === self.name);
        if (!s) {
          // Deleted from the App Store while this was open.
          if (isOpen('mcp')) closeApp('mcp');
          return;
        }
        const on = s.enabled !== false;
        const using = appUsage.active(s.name);
        title.textContent = s.name;
        win.setAttribute('aria-label', s.name);
        nameEl.textContent = s.name;
        subEl.textContent = s.transport === 'stdio' ? 'local · ' + (s.command || '') : (s.url || '');
        subEl.title = subEl.textContent;
        root.classList.toggle('off', !on);
        root.classList.toggle('using', using);
        status.innerHTML = '';
        if (using) {
          status.append('The agent is using this app now');
        } else {
          const b = document.createElement('b');
          b.textContent = on ? 'Enabled' : 'Disabled';
          status.append(b, on ? ' — your agent can use its tools' : ' — your agent won’t see it');
        }
        onBtn.classList.toggle('active', on);
        offBtn.classList.toggle('active', !on);
        onBtn.disabled = busy || on;
        offBtn.disabled = busy || !on;
        note.innerHTML = 'To remove this app, open the <a data-open-store>App Store</a>.';
      },
    };

    async function setEnabled(enabled) {
      const name = self.name;
      if (!name || busy) return;
      busy = true;
      msgEl.textContent = '';
      msgEl.className = 'mw-msg';
      self.sync();
      try {
        const res = await fetch('/api/mcp/' + encodeURIComponent(name), {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ enabled, user: currentUser }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Error ' + res.status);
        if (data.warning) { msgEl.textContent = data.warning; msgEl.className = 'mw-msg warn'; }
        busy = false;
        renderMcpServers(data.servers || mcpServers);
      } catch (e) {
        busy = false;
        msgEl.textContent = 'Couldn’t switch it: ' + e.message;
        msgEl.className = 'mw-msg err';
        self.sync();
      }
    }
    onBtn.addEventListener('click', () => setEnabled(true));
    offBtn.addEventListener('click', () => setEnabled(false));
    note.addEventListener('click', e => {
      if (!e.target.closest('[data-open-store]') || !self.name) return;
      openApp('appstore', { src: '/appstore?tab=installed&app=' + encodeURIComponent(self.name) });
    });
    return self;
  })();
