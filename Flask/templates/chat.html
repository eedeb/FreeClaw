<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>FreeClaw</title>

  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="FreeClaw"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="theme-color" content="#0d0d0f"/>
  <meta name="description" content="An AI agent that doesn't burn your money."/>

  <link rel="apple-touch-icon" href="https://freeclaw.eedeb.dev/eagle.png"/>
  <link rel="icon" href="https://freeclaw.eedeb.dev/eagle.png"/>

  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Syne:wght@400;600;700&display=swap" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d0d0f;
      --surface: #141416;
      --border: #222228;
      --accent: #c8f04a;
      --accent-dim: #a8cc38;
      --text: #e8e8ec;
      --muted: #666672;
      --user-bg: #1a1f10;
      --agent-bg: #141416;
      /* Was referenced by the approval card and the stop button but only ever
         defined in settings.html, so every var(--err) here silently resolved to
         nothing. Same value as settings.html. */
      --err: #e05555;
      --radius: 4px;
      --mono: 'IBM Plex Mono', monospace;
      --sans: 'Syne', sans-serif;
    }

    html, body {
      height: 100%;
      color-scheme: dark;
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      font-size: 15px;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(var(--border) 1px, transparent 1px),
        linear-gradient(90deg, var(--border) 1px, transparent 1px);
      background-size: 40px 40px;
      opacity: 0.35;
      pointer-events: none;
      z-index: 0;
    }

    /* ── Desktop shell ──
       The page is a desktop: a menu bar along the top, app icons scattered
       over the wallpaper, the chat thread in a centre column that grows up
       from the composer at the bottom, and apps opening in windows above it
       all. Stacking, bottom to top: wallpaper, icons, chat, windows, menu bar. */
    :root {
      --topbar-h: calc(38px + env(safe-area-inset-top));
      /* Where the chat column starts. Pushed down by the script when the
         icons have nowhere else to go and line up under the menu bar. */
      --chat-top: var(--topbar-h);
      --chat-w: min(820px, calc(100vw - 24px));
      --icon-w: 86px;
    }

    #desktop {
      position: fixed;
      inset: 0;
      z-index: 1;
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }

    /* Wallpaper mark — stands in for the old empty-state placeholder, and
       the thread rises up over it once there is one. */
    #wallpaper {
      position: absolute;
      left: 50%;
      top: 42%;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      text-align: center;
      pointer-events: none;
      transition: opacity 0.45s ease, transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
      z-index: 0;
    }
    #wallpaper .eagle-wrap {
      width: 84px; height: 84px;
      border-radius: 20px;
      overflow: hidden;
      opacity: 0.18;
      border: 1px solid rgba(200,240,74,0.15);
    }
    #wallpaper .eagle-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
    #wallpaper .empty-name {
      font-size: 15px; font-weight: 700; letter-spacing: 0.2em;
      text-transform: uppercase; color: var(--muted); opacity: 0.45;
    }
    #wallpaper .empty-sub {
      font-family: var(--mono); font-size: 11px; color: var(--muted);
      line-height: 1.9; opacity: 0.4;
    }
    body.thread #wallpaper { opacity: 0; transform: translate(-50%, -62%); }

    /* ── Menu bar ── */
    #topbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: var(--topbar-h);
      padding: env(safe-area-inset-top) calc(12px + env(safe-area-inset-right)) 0 calc(12px + env(safe-area-inset-left));
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(13,13,15,0.82);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      z-index: 5000;
      -webkit-user-select: none;
      user-select: none;
    }

    .header-icon {
      width: 22px; height: 22px;
      border-radius: 6px;
      overflow: hidden;
      flex-shrink: 0;
      border: 1px solid rgba(200,240,74,0.2);
    }
    .header-icon img { width: 100%; height: 100%; object-fit: cover; display: block; }

    .header-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent);
      animation: pulse 2.5s ease-in-out infinite;
      flex-shrink: 0;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; box-shadow: 0 0 8px var(--accent); }
      50% { opacity: 0.4; box-shadow: 0 0 3px var(--accent); }
    }

    .header-title {
      display: flex;
      align-items: baseline;
      gap: 9px;
      min-width: 0; /* allow text to truncate */
      flex-shrink: 1;
    }
    .header-title h1 {
      font-family: var(--sans);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text);
      line-height: 1;
      white-space: nowrap;
    }
    .header-tagline {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--muted);
      letter-spacing: 0.03em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 260px;
    }
    @media (max-width: 560px) { .header-tagline { display: none; } }

    /* Open windows, like a taskbar folded into the menu bar. */
    #tasks {
      flex: 1;
      min-width: 0;
      display: flex;
      justify-content: center;
      gap: 4px;
      overflow: hidden;
    }
    .task {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      max-width: 150px;
      background: none;
      border: 1px solid transparent;
      border-radius: 6px;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 10.5px;
      letter-spacing: 0.04em;
      padding: 4px 9px;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s, color 0.15s, border-color 0.15s, opacity 0.15s;
    }
    .task svg { width: 13px; height: 13px; flex-shrink: 0; }
    .task:hover { color: var(--text); background: rgba(255,255,255,0.04); }
    .task.active { color: var(--accent); border-color: rgba(200,240,74,0.25); background: rgba(200,240,74,0.06); }
    .task.minimized { opacity: 0.55; }
    @media (max-width: 560px) { .task span { display: none; } }

    .header-right {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }
    #clock {
      font-family: var(--mono);
      font-size: 10.5px;
      color: var(--text);
      opacity: 0.75;
      white-space: nowrap;
    }
    @media (max-width: 420px) { #clock { display: none; } }

    #token-count {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--muted);
      white-space: nowrap;
      cursor: default;
    }
    /* An exact count from the provider, as opposed to the '~' estimate —
       worth distinguishing, since the two measure different things. */
    #token-count.exact { color: var(--accent-dim); }
    @media (max-width: 380px) { #token-count { display: none; } }

    #reset-btn {
      background: none;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--muted);
      font-family: var(--mono);
      font-size: 9.5px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 4px 9px;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
      -webkit-user-select: none;
      user-select: none;
      white-space: nowrap;
      flex-shrink: 0;
    }
    #reset-btn:hover { border-color: rgba(192,57,57,0.5); color: #e05555; }
    #reset-btn:active { border-color: rgba(192,57,57,0.5); color: #e05555; transform: scale(0.96); }

    /* ── Desktop icons ──
       Absolutely placed and moved with transform, so being shoved out of the
       thread's way (or dragged somewhere new) animates for free. */
    #icons {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
    }
    .app-icon {
      position: absolute;
      left: 0; top: 0;
      width: var(--icon-w);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 7px;
      padding: 8px 4px 6px;
      background: none;
      border: 1px solid transparent;
      border-radius: 12px;
      color: var(--text);
      cursor: default;
      pointer-events: auto;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      transition: transform 0.55s cubic-bezier(0.2, 0.85, 0.25, 1), opacity 0.3s ease,
                  background 0.15s, border-color 0.15s;
      will-change: transform;
    }
    .app-icon[hidden] { display: none; }
    .app-icon:focus-visible { outline: none; border-color: rgba(200,240,74,0.4); }
    .app-icon.dragging { transition: none; z-index: 5; opacity: 0.85; }
    .app-icon.selected { background: rgba(200,240,74,0.07); border-color: rgba(200,240,74,0.22); }
    .app-tile {
      width: 54px; height: 54px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(160deg, var(--tile-a, #1d1d22), var(--tile-b, #121215));
      border: 1px solid rgba(255,255,255,0.07);
      box-shadow: 0 8px 22px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.06);
      color: var(--accent);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .app-tile svg { width: 26px; height: 26px; }
    .app-icon:hover .app-tile { transform: translateY(-2px); box-shadow: 0 12px 28px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.08); }
    .app-icon:active .app-tile { transform: scale(0.94); }
    .app-label {
      font-family: var(--mono);
      font-size: 10.5px;
      letter-spacing: 0.04em;
      padding: 1px 6px;
      border-radius: 4px;
      text-shadow: 0 1px 3px rgba(0,0,0,0.9);
      white-space: nowrap;
    }
    .app-icon.selected .app-label { background: rgba(200,240,74,0.85); color: #10100c; text-shadow: none; }
    /* Lined up under the menu bar on screens too narrow to step aside. */
    .app-icon.compact { gap: 4px; padding: 4px 2px; }
    .app-icon.compact .app-tile { width: 38px; height: 38px; border-radius: 11px; }
    .app-icon.compact .app-tile svg { width: 19px; height: 19px; }
    .app-icon.compact .app-label { font-size: 9px; }

    #icon-browser  { --tile-a: #1a2531; --tile-b: #10151c; }
    #icon-files    { --tile-a: #2a2516; --tile-b: #17140c; }
    #icon-settings { --tile-a: #22222b; --tile-b: #131318; }
    #icon-home     { --tile-a: #1d2512; --tile-b: #11150a; }
    #icon-appstore { --tile-a: #1c2130; --tile-b: #10131b; }

    /* ── Installed MCP apps ──
       One icon per server from the App Store. The tile holds the vendor's
       icon, or the name's first letter tinted from the name. */
    .app-icon.mcp-app .app-tile img { width: 30px; height: 30px; object-fit: contain; border-radius: 7px; }
    .app-icon.mcp-app .app-tile .app-letter {
      font-family: var(--sans); font-weight: 700; font-size: 24px; line-height: 1;
      color: hsl(var(--h, 80) 70% 70%); text-transform: uppercase;
    }
    .app-icon.mcp-app.letter .app-tile { --tile-a: hsl(var(--h, 80) 30% 17%); --tile-b: hsl(var(--h, 80) 30% 9%); }
    .app-icon.compact.mcp-app .app-tile img { width: 22px; height: 22px; }
    .app-icon.compact.mcp-app .app-tile .app-letter { font-size: 17px; }
    /* Switched off for this user: still there, clearly asleep. */
    .app-icon.off .app-tile { filter: grayscale(1) brightness(0.7); opacity: 0.45; }
    .app-icon.off .app-label { opacity: 0.5; }

    /* In use: the agent is calling one of this app's tools right now. A ring
       of light runs round the tile while it glows. */
    @property --ring { syntax: '<angle>'; inherits: false; initial-value: 0deg; }
    .app-tile { position: relative; }
    .app-icon.using .app-tile {
      box-shadow: 0 0 0 1px rgba(200,240,74,0.55), 0 0 22px 3px rgba(200,240,74,0.4), 0 8px 22px rgba(0,0,0,0.45);
      animation: usingPulse 1.6s ease-in-out infinite;
    }
    .app-icon.using .app-tile::before {
      content: '';
      position: absolute;
      inset: -5px;
      border-radius: 19px;
      padding: 2px;
      background: conic-gradient(from var(--ring), transparent 0 50%, rgba(200,240,74,0.25) 62%, var(--accent) 80%, #fff 84%, transparent 90%);
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      animation: usingRing 1.1s linear infinite;
      pointer-events: none;
    }
    .app-icon.compact.using .app-tile::before { border-radius: 16px; inset: -4px; }
    .app-icon.using .app-label { color: var(--accent); }
    @keyframes usingRing { to { --ring: 360deg; } }
    @keyframes usingPulse {
      0%, 100% { box-shadow: 0 0 0 1px rgba(200,240,74,0.55), 0 0 14px 1px rgba(200,240,74,0.3), 0 8px 22px rgba(0,0,0,0.45); }
      50%      { box-shadow: 0 0 0 1px rgba(200,240,74,0.8), 0 0 28px 6px rgba(200,240,74,0.5), 0 8px 22px rgba(0,0,0,0.45); }
    }
    @media (prefers-reduced-motion: reduce) {
      .app-icon.using .app-tile, .app-icon.using .app-tile::before { animation: none; }
    }

    /* ── Chat column ──
       Spans the whole height but only its thread and composer take clicks,
       so icons beside or above a short thread stay usable. The thread is
       bottom-anchored: it starts just above the composer and climbs. */
    #chat {
      position: absolute;
      left: 50%;
      width: var(--chat-w);
      top: var(--chat-top);
      bottom: 0;
      transform: translateX(-50%);
      z-index: 3;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      pointer-events: none;
      transition: top 0.45s cubic-bezier(0.2, 0.85, 0.25, 1);
    }

    /* ── Messages ── */
    #messages {
      flex: 0 1 auto;
      min-height: 0;
      pointer-events: auto;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 18px 6px 12px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      /* Older messages fade out as they pass under the menu bar / icons. */
      -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 22px);
      mask-image: linear-gradient(to bottom, transparent 0, #000 22px);
    }
    body:not(.thread) #messages { padding: 0; }

    #messages::-webkit-scrollbar { width: 3px; }
    #messages::-webkit-scrollbar-track { background: transparent; }
    #messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .message {
      display: flex;
      flex-direction: column;
      max-width: 88%;
      animation: fadeUp 0.22s ease forwards;
      opacity: 0;
    }
    @media (min-width: 600px) { .message { max-width: 78%; } }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .message.user  { align-self: flex-end;   align-items: flex-end; }
    .message.agent { align-self: flex-start; align-items: flex-start; }

    .msg-label {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 5px;
      color: var(--muted);
    }
    .message.user .msg-label { color: var(--accent-dim); }

    .bubble {
      padding: 11px 14px;
      border-radius: var(--radius);
      line-height: 1.65;
      border: 1px solid var(--border);
      word-break: break-word;
      overflow-wrap: break-word;
    }
    .message.user .bubble  { background: var(--user-bg); border-color: #2a3318; color: #d8f0a0; }
    .message.agent .bubble { background: var(--agent-bg); border-color: var(--border); }

    /* Markdown */
    .bubble p { margin-bottom: 0.6em; }
    .bubble p:last-child { margin-bottom: 0; }
    .bubble code {
      font-family: var(--mono); font-size: 0.82em;
      background: #1e1e24; border: 1px solid var(--border);
      padding: 1px 5px; border-radius: 3px; color: var(--accent); word-break: break-all;
    }
    .bubble pre {
      background: #0a0a0c; border: 1px solid var(--border);
      border-radius: var(--radius); padding: 12px;
      overflow-x: auto; margin: 8px 0; -webkit-overflow-scrolling: touch;
    }
    .bubble pre code { background: none; border: none; padding: 0; color: #c8e6a0; font-size: 0.82em; word-break: normal; }
    .bubble ul, .bubble ol { padding-left: 20px; margin: 6px 0; }
    .bubble li { margin-bottom: 3px; }
    .bubble h1, .bubble h2, .bubble h3 { font-family: var(--sans); font-weight: 700; margin: 10px 0 5px; color: var(--accent); }
    .bubble h1 { font-size: 1.1em; } .bubble h2 { font-size: 1em; } .bubble h3 { font-size: 0.92em; }
    .bubble strong { color: #fff; font-weight: 600; }
    .bubble blockquote { border-left: 2px solid var(--accent); padding-left: 12px; color: var(--muted); margin: 6px 0; }
    .bubble a { color: var(--accent); text-decoration: underline; }

    /* Uploaded image attachments */
    .bubble .msg-image-link { display: block; cursor: zoom-in; }
    .bubble .msg-image {
      display: block;
      max-width: 100%;
      max-height: 360px;
      width: auto;
      height: auto;
      border-radius: 3px;
      border: 1px solid var(--border);
    }
    .bubble .msg-caption { margin-top: 8px; text-decoration: none; }

    /* Thinking dots */
    .thinking .bubble { display: flex; gap: 5px; align-items: center; padding: 14px 16px; }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); animation: blink 1.2s ease-in-out infinite; }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes blink {
      0%, 80%, 100% { opacity: 0.2; transform: scale(0.85); }
      40% { opacity: 1; transform: scale(1); }
    }

    /* Empty state — still how the script marks an empty thread, but the
       wallpaper draws the placeholder now, so it takes no room here. */
    #empty-state { display: none; }

    /* ── Input area ── a floating composer, docked at the bottom. */
    #input-area {
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      pointer-events: auto;
      margin-bottom: calc(12px + env(safe-area-inset-bottom));
      padding: 9px;
      border: 1px solid #2a2a31;
      border-radius: 14px;
      background: rgba(20,20,23,0.86);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 14px 44px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.04);
    }

    #input-row {
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }

    #user-input {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-family: var(--sans);
      font-size: 16px; /* prevents iOS zoom */
      padding: 11px 14px;
      resize: none;
      min-height: 44px;
      max-height: 130px;
      outline: none;
      transition: border-color 0.15s;
      line-height: 1.5;
      -webkit-appearance: none;
      appearance: none;
    }
    #user-input:focus { border-color: #3a3a44; }
    #user-input::placeholder { color: var(--muted); }

    #send-btn {
      background: var(--accent);
      border: none;
      border-radius: var(--radius);
      width: 44px; height: 44px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.15s, transform 0.1s;
      -webkit-user-select: none;
      user-select: none;
    }
    #send-btn:active { transform: scale(0.92); background: var(--accent-dim); }
    #send-btn:disabled { background: #2a2a30; cursor: not-allowed; }
    #send-btn svg { width: 18px; height: 18px; }

    /* ── Stop button ──
       Takes the send button's place for the length of a turn rather than
       sitting beside it: same 44px footprint so the composer doesn't reflow,
       and the one control in that corner is always the one that makes sense
       right now. Only shown while something is actually running, so it can't
       be pressed when there's nothing to stop. */
    #stop-btn {
      display: none;
      background: var(--err);
      border: none;
      border-radius: var(--radius);
      width: 44px; height: 44px;
      cursor: pointer;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.15s, transform 0.1s, opacity 0.15s;
      -webkit-user-select: none;
      user-select: none;
    }
    #stop-btn.visible { display: flex; }
    #stop-btn:active { transform: scale(0.92); background: #c04444; }
    #stop-btn:disabled { opacity: 0.5; cursor: default; }
    #stop-btn svg { width: 18px; height: 18px; display: block; }

    /* ── Upload button ── */
    #upload-btn {
      background: none;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      width: 44px; height: 44px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: border-color 0.15s, background 0.15s, transform 0.1s;
      color: var(--muted);
      -webkit-user-select: none;
      user-select: none;
    }
    #upload-btn:hover { border-color: var(--accent); color: var(--accent); }
    #upload-btn:active { transform: scale(0.92); background: rgba(200,240,74,0.07); }
    #upload-btn svg { width: 20px; height: 20px; }

    /* ── File preview pill ── */
    #file-preview {
      display: none;
      align-items: center;
      gap: 7px;
      padding: 5px 10px;
      background: #1a1f10;
      border: 1px solid #2a3318;
      border-radius: var(--radius);
      margin-bottom: 6px;
      position: relative;
      overflow: hidden;
      animation: fadeUp 0.18s ease forwards;
    }
    #file-preview.visible { display: flex; }
    #file-preview-bar {
      position: absolute;
      left: 0; top: 0; bottom: 0;
      background: rgba(200,240,74,0.08);
      border-radius: var(--radius);
      width: 0%;
      transition: width 0.25s ease;
      pointer-events: none;
    }
    #file-preview-name {
      font-family: var(--mono);
      font-size: 11px;
      color: #d8f0a0;
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    #file-preview-status {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--muted);
      white-space: nowrap;
    }
    #file-remove-btn {
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      padding: 0 2px;
      font-size: 14px;
      line-height: 1;
      transition: color 0.15s;
      flex-shrink: 0;
    }
    #file-remove-btn:hover { color: #e05555; }

    /* ── PWA Splash ── */
    #splash {
      position: fixed;
      inset: 0;
      background: var(--bg);
      z-index: 9999;
      display: none; /* hidden by default, shown only in standalone via JS */
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      pointer-events: none;
    }
    #splash.visible { display: flex; }
    #splash.hide { animation: splashOut 0.35s ease forwards; }

    .splash-icon {
      width: 100px; height: 100px;
      border-radius: 24px;
      overflow: hidden;
      border: 1px solid rgba(200,240,74,0.25);
      box-shadow: 0 0 50px rgba(200,240,74,0.1);
      animation: splashIconIn 0.5s cubic-bezier(0.34,1.56,0.64,1) forwards;
      opacity: 0;
    }
    .splash-icon img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .splash-name {
      font-family: var(--sans);
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--accent);
      opacity: 0;
      animation: splashTextIn 0.4s ease 0.35s forwards;
    }
    .splash-sub {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--muted);
      letter-spacing: 0.06em;
      opacity: 0;
      margin-top: -8px;
      animation: splashTextIn 0.4s ease 0.5s forwards;
    }

    @keyframes splashIconIn {
      from { opacity: 0; transform: scale(0.75) translateY(12px); }
      to   { opacity: 1; transform: scale(1) translateY(0); }
    }
    @keyframes splashTextIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes splashOut {
      from { opacity: 1; }
      to   { opacity: 0; visibility: hidden; }
    }

    /* ── Tool call blocks ── */
    .tool-group {
      align-self: flex-start;
      max-width: 88%;
      animation: fadeUp 0.22s ease forwards;
      opacity: 0;
      margin: 2px 0;
    }
    @media (min-width: 600px) { .tool-group { max-width: 78%; } }

    .tool-toggle {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      padding: 5px 10px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: #0f0f12;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      user-select: none;
      -webkit-user-select: none;
      transition: border-color 0.15s, color 0.15s;
      width: fit-content;
    }
    .tool-toggle:hover { border-color: rgba(200,240,74,0.3); color: var(--accent); }

    .tool-toggle-arrow {
      display: inline-block;
      transition: transform 0.18s ease;
      font-style: normal;
      font-size: 9px;
    }
    .tool-toggle.open .tool-toggle-arrow { transform: rotate(90deg); }

    .tool-live-dot {
      width: 5px; height: 5px; border-radius: 50%;
      background: var(--accent);
      animation: blink 1.2s ease-in-out infinite;
      flex-shrink: 0;
    }
    .tool-live.done .tool-live-dot { animation: none; background: var(--muted); }

    .tool-details {
      display: none;
      margin-top: 4px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .tool-details.open { display: block; }

    .tool-section {
      padding: 9px 12px;
      border-bottom: 1px solid var(--border);
    }
    .tool-section:last-child { border-bottom: none; }

    .tool-section-label {
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 5px;
    }

    .tool-name {
      color: var(--accent);
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 500;
    }

    .tool-code {
      font-family: var(--mono);
      font-size: 10.5px;
      line-height: 1.55;
      color: #c8e6a0;
      background: #0a0a0c;
      border-radius: 3px;
      padding: 8px 10px;
      overflow-x: auto;
      white-space: pre-wrap;
      word-break: break-all;
      -webkit-overflow-scrolling: touch;
      margin: 0;
    }

    .tool-result-ok   { color: #c8e6a0; }
    .tool-result-err  { color: #e07070; }

    /* ── Reasoning block ──
       Reasoning models stream their thinking on a field of its own, ahead of
       the reply. Collapsed by default: it's usually several times longer than
       the answer and is there to be checked, not read. Reuses the tool pill
       wholesale (.tool-group / .tool-toggle / .tool-details / .tool-section) —
       only the body differs, since this is prose rather than code. */
    .reasoning-body {
      font-family: var(--sans);
      font-size: 12.5px;
      line-height: 1.6;
      color: #9a9aa8;
      background: transparent;
      white-space: pre-wrap;
      word-break: normal;
      overflow-wrap: anywhere;
      padding: 0;
      margin: 0;
    }
    /* Still streaming. Its own keyframe rather than the dots' `blink`, which
       scales as well as fades and reads as a wobble on text. The arrow stays
       live throughout, so the panel can be opened to watch the thinking
       arrive rather than only read it back afterwards. */
    .reasoning-live .reasoning-label { animation: reasoningPulse 1.4s ease-in-out infinite; }
    @keyframes reasoningPulse {
      0%, 100% { opacity: 0.45; }
      50%      { opacity: 1; }
    }

    /* ── Bash approval prompt ──
       Shown when the agent wants to run a shell command not already covered by
       a saved always-allow rule. The agent's turn is blocked on the other side
       of it, so it's styled to demand attention rather than blend in with the
       tool pills. Reuses .tool-group (width/animation) and .tool-code (the
       command block) — only what differs is defined here. */
    .approval {
      border: 1px solid rgba(224,85,85,0.45);
      border-left: 2px solid var(--err);
      border-radius: var(--radius);
      background: #17131a;
      padding: 11px 13px;
    }
    .approval-head {
      font-family: var(--mono); font-size: 10px; letter-spacing: 0.08em;
      text-transform: uppercase; color: var(--err); margin-bottom: 7px;
    }
    .approval .tool-code { color: #e8d8a0; margin-bottom: 9px; }
    .approval-actions { display: flex; flex-wrap: wrap; gap: 6px; }
    .approval-btn {
      font-family: var(--mono); font-size: 10.5px; padding: 7px 10px;
      border-radius: var(--radius); border: 1px solid var(--border);
      background: var(--surface); color: var(--text); cursor: pointer;
      transition: border-color 0.15s, color 0.15s, opacity 0.15s;
    }
    .approval-btn:hover:not(:disabled) { border-color: var(--accent-dim); color: var(--accent); }
    .approval-btn.deny:hover:not(:disabled) { border-color: var(--err); color: var(--err); }
    .approval-btn:disabled { opacity: 0.4; cursor: default; }
    .approval-note {
      font-family: var(--mono); font-size: 9.5px; color: var(--muted);
      margin-top: 8px; line-height: 1.5;
    }
    .approval.settled { border-color: var(--border); border-left-color: var(--muted); }
    .approval.settled .approval-head { color: var(--muted); }

    /* ── Sign-in request ──
       The agent hit a login and handed it to the user (request_sign_in).
       Built on the approval card, but in the accent rather than the warning
       colour: it's an invitation, and nothing is blocked waiting on it. */
    .signin { border-color: rgba(200,240,74,0.35); border-left-color: var(--accent); background: #13150f; }
    .signin .approval-head { color: var(--accent); }
    .signin-host { font-family: var(--mono); font-size: 13px; color: var(--text); margin-bottom: 10px; word-break: break-all; }
    .signin a.approval-btn { text-decoration: none; display: inline-block; }
    .signin .approval-btn.primary { background: var(--accent); border-color: var(--accent); color: #10100c; }
    .signin .approval-btn.primary:hover { background: var(--accent-dim); color: #10100c; }
    .signin.saved .approval-head::after { content: ' · saved ✓'; }
    .signin.past { border-color: var(--border); border-left-color: var(--muted); background: transparent; }
    .signin.past .approval-head { color: var(--muted); }

    /* ── Windows ──
       Apps open in these: dragged by the title bar, resized from the corner,
       brought to the front on any press. On a phone there's no room to
       arrange anything, so every window simply fills the screen. */
    #windows {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      top: var(--topbar-h);
      z-index: 10;
      pointer-events: none;
    }
    .win {
      position: absolute;
      display: flex;
      flex-direction: column;
      min-width: 300px;
      min-height: 200px;
      background: var(--surface);
      border: 1px solid #26262d;
      border-radius: 11px;
      overflow: hidden;
      pointer-events: auto;
      box-shadow: 0 18px 50px rgba(0,0,0,0.5), 0 0 0 1px rgba(0,0,0,0.35);
      transition: box-shadow 0.2s, border-color 0.2s;
    }
    .win[hidden], .win.minimized { display: none; }
    .win.focused {
      border-color: #33333c;
      box-shadow: 0 28px 70px rgba(0,0,0,0.6), 0 0 0 1px rgba(0,0,0,0.35), 0 0 0 1px rgba(200,240,74,0.05) inset;
    }
    .win.opening { animation: winIn 0.2s cubic-bezier(0.2, 0.9, 0.3, 1.1); }
    .win.closing { animation: winOut 0.14s ease-in forwards; pointer-events: none; }
    @keyframes winIn  { from { opacity: 0; transform: scale(0.94) translateY(10px); } to { opacity: 1; transform: none; } }
    @keyframes winOut { to   { opacity: 0; transform: scale(0.96) translateY(6px); } }

    .win.max {
      left: 0 !important; top: 0 !important;
      width: 100% !important; height: 100% !important;
      border-radius: 0;
      border-width: 1px 0 0;
    }
    @media (max-width: 719px) {
      .win {
        left: 0 !important; top: 0 !important;
        width: 100% !important; height: 100% !important;
        min-width: 0;
        border-radius: 0;
        border-width: 1px 0 0;
      }
      .win-resize, .wl.max { display: none; }
    }

    .win-bar {
      position: relative;
      display: flex;
      align-items: center;
      gap: 10px;
      height: 36px;
      padding: 0 12px;
      flex-shrink: 0;
      background: linear-gradient(#1c1c21, #16161a);
      border-bottom: 1px solid var(--border);
      cursor: grab;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
    }
    .win.max .win-bar { cursor: default; }
    body.wm-drag, body.wm-drag * { cursor: grabbing !important; }
    body.wm-resize, body.wm-resize * { cursor: nwse-resize !important; }
    /* An iframe under the pointer would swallow the move events mid-drag. */
    body.wm-drag iframe, body.wm-resize iframe { pointer-events: none; }
    body.wm-drag, body.wm-resize { -webkit-user-select: none; user-select: none; }

    .win-lights { display: flex; gap: 7px; position: relative; z-index: 1; }
    .wl {
      width: 12px; height: 12px;
      border-radius: 50%;
      border: none;
      padding: 0;
      background: #34343c;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(0,0,0,0.6);
      font-size: 9px;
      line-height: 1;
      transition: background 0.15s;
    }
    .wl::after { content: attr(data-glyph); opacity: 0; font-weight: 700; }
    .win-lights:hover .wl::after { opacity: 1; }
    .win.focused .wl.close, .win-lights:hover .wl.close { background: #e05555; }
    .win.focused .wl.min,   .win-lights:hover .wl.min   { background: #e0b43c; }
    .win.focused .wl.max,   .win-lights:hover .wl.max   { background: var(--accent-dim); }
    .win-title {
      position: absolute;
      left: 80px; right: 80px;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      pointer-events: none;
    }
    .win-title svg { width: 13px; height: 13px; flex-shrink: 0; }
    .win.focused .win-title { color: var(--text); }
    .win-title .wt-text { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
    /* A page title, in its own case — it's the site's words, not a label. */
    .win-title .wt-text.page { text-transform: none; letter-spacing: 0.02em; font-family: var(--sans); font-size: 12px; font-weight: 600; }
    .win.focused .win-title svg { color: var(--accent); }

    .win-body {
      flex: 1;
      min-height: 0;
      position: relative;
      display: flex;
      flex-direction: column;
      background: var(--bg);
    }
    .win-body iframe {
      flex: 1;
      width: 100%;
      border: 0;
      display: block;
      background: var(--bg);
    }
    .win-resize {
      position: absolute;
      right: 0; bottom: 0;
      width: 18px; height: 18px;
      cursor: nwse-resize;
      touch-action: none;
      z-index: 2;
      background:
        linear-gradient(135deg, transparent 0 55%, var(--muted) 55% 61%, transparent 61% 72%, var(--muted) 72% 78%, transparent 78%);
      opacity: 0.45;
    }
    .win-resize:hover { opacity: 0.9; }
    .win.max .win-resize { display: none; }

    /* ── Files window ──
       Everything in this user's files folder — the agent's memory and
       schedule at the top, then whatever it wrote or was given. A list, and
       one file at a time viewed or edited in place. */
    #context-panel {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      background: var(--surface);
      padding-bottom: env(safe-area-inset-bottom);
    }

    .ctx-head {
      display: flex;
      align-items: baseline;
      gap: 9px;
      padding: 11px 16px 10px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .ctx-title {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--accent);
    }
    .ctx-user {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    #ctx-text {
      flex: 1;
      width: 100%;
      resize: none;
      border: none;
      outline: none;
      background: transparent;
      color: var(--text);
      font-family: var(--mono);
      font-size: 12.5px;
      line-height: 1.65;
      padding: 14px 16px;
      -webkit-overflow-scrolling: touch;
    }
    #ctx-text::placeholder { color: var(--muted); }
    #ctx-text:disabled { opacity: 0.5; }

    .ctx-foot {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px 16px 13px;
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }
    #ctx-status {
      font-family: var(--mono);
      font-size: 9.5px;
      color: var(--muted);
      line-height: 1.4;
      flex: 1;
      min-width: 0;
    }
    #ctx-status.err { color: var(--err); }
    #ctx-status.ok  { color: var(--accent-dim); }
    #ctx-save {
      background: var(--accent);
      border: none;
      border-radius: var(--radius);
      color: #0d0d0f;
      font-family: var(--mono);
      font-size: 10.5px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 8px 15px;
      cursor: pointer;
      flex-shrink: 0;
      transition: opacity 0.15s;
    }
    #ctx-save:disabled { opacity: 0.35; cursor: default; }

    /* A panel section is laid out with flex when shown, so `hidden` alone
       loses to that — this is what actually hides the half we're not on. */
    #context-panel [hidden] { display: none !important; }

    #ctx-back {
      background: none;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--muted);
      font-size: 12px;
      line-height: 1;
      padding: 6px 9px;
      cursor: pointer;
      flex-shrink: 0;
      align-self: center;
      transition: border-color 0.15s, color 0.15s;
    }
    #ctx-back:hover { border-color: var(--accent-dim); color: var(--accent); }

    .ctx-title { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    #ctx-list-view {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    #ctx-list { list-style: none; margin: 0; padding: 6px 0; }
    .ctx-row {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      background: none;
      border: none;
      border-bottom: 1px solid var(--border);
      color: var(--text);
      font-family: var(--mono);
      font-size: 12px;
      text-align: left;
      padding: 11px 16px;
      cursor: pointer;
      transition: background 0.12s;
    }
    .ctx-row:hover { background: rgba(255,255,255,0.04); }
    .ctx-row-icon { flex-shrink: 0; font-size: 13px; line-height: 1; }
    .ctx-row-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ctx-row.protected .ctx-row-name { color: var(--accent); }
    .ctx-row-meta {
      flex-shrink: 0;
      font-size: 9.5px;
      color: var(--muted);
      letter-spacing: 0.04em;
    }
    #ctx-list-empty, #ctx-binary {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--muted);
      line-height: 1.7;
      padding: 18px 16px;
    }

    #ctx-file-view {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }
    #ctx-image-wrap {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      overflow: auto;
    }
    #ctx-image { max-width: 100%; max-height: 100%; border-radius: var(--radius); }

    #ctx-delete {
      background: none;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--muted);
      font-family: var(--mono);
      font-size: 10.5px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 8px 12px;
      cursor: pointer;
      flex-shrink: 0;
      transition: border-color 0.15s, color 0.15s;
    }
    #ctx-delete:hover:not(:disabled) { border-color: var(--err); color: var(--err); }
    #ctx-delete:disabled { opacity: 0.35; cursor: default; }

    /* ── Agent browser ──
       A replay of the agent's browser tools, not a browser: the page is a few
       dozen plain elements built from the tool's own result (title, and the
       buttons/links/inputs it reported), laid out at a fixed 760px and scaled
       to fit. Everything that moves — cursor, scroll, progress, scan — moves
       by transform or opacity, so the compositor does the work. */
    #win-agent .win-body { background: #0b0b0d; }
    .ab-live {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--muted);
      flex-shrink: 0;
    }
    #win-agent.working .ab-live { background: var(--accent); box-shadow: 0 0 6px var(--accent); animation: pulse 1.6s ease-in-out infinite; }

    .ab-chrome {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 7px 10px;
      background: #141418;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .ab-nav { display: flex; gap: 9px; color: var(--muted); font-size: 12px; line-height: 1; }
    .ab-addr {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 5px 11px;
      background: #0d0d0f;
      border: 1px solid var(--border);
      border-radius: 999px;
      font-family: var(--mono);
      font-size: 11px;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      transition: border-color 0.15s;
    }
    .ab-addr svg { width: 11px; height: 11px; flex-shrink: 0; color: var(--muted); }
    .ab-url { overflow: hidden; text-overflow: ellipsis; }
    .ab-addr.editing { border-color: var(--accent-dim); }
    .ab-caret { display: none; width: 1px; height: 12px; background: var(--accent); flex-shrink: 0; animation: caret 0.9s steps(1) infinite; }
    .ab-addr.editing .ab-caret { display: block; }
    @keyframes caret { 50% { opacity: 0; } }

    .ab-view {
      position: relative;
      flex: 1;
      min-height: 0;
      overflow: hidden;
      background: #111114;
      contain: strict;
    }
    .ab-progress {
      position: absolute;
      left: 0; top: 0;
      width: 100%; height: 2px;
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent);
      transform-origin: 0 50%;
      transform: scaleX(0);
      opacity: 0;
      z-index: 4;
    }
    .ab-progress.run  { opacity: 1; transform: scaleX(0.75); transition: transform 2.4s cubic-bezier(0.1, 0.7, 0.2, 1), opacity 0.1s; }
    .ab-progress.done { opacity: 0; transform: scaleX(1); transition: transform 0.25s ease-out, opacity 0.3s ease 0.25s; }

    .ab-scan {
      position: absolute;
      left: 0; right: 0; top: 0;
      height: 45%;
      background: linear-gradient(to bottom, transparent, rgba(200,240,74,0.09) 70%, rgba(200,240,74,0.35) 99%, transparent);
      transform: translateY(-100%);
      opacity: 0;
      pointer-events: none;
      z-index: 3;
    }
    .ab-scan.on { opacity: 1; animation: abScan 1.5s ease-in-out infinite; }
    @keyframes abScan { from { transform: translateY(-100%); } to { transform: translateY(230%); } }

    .ab-cursor {
      position: absolute;
      left: 0; top: 0;
      width: 18px; height: 18px;
      z-index: 5;
      opacity: 0;
      pointer-events: none;
      transform: translate(40px, 40px);
      transition: transform 0.6s cubic-bezier(0.3, 0.75, 0.2, 1), opacity 0.25s;
      filter: drop-shadow(0 2px 3px rgba(0,0,0,0.6));
    }
    .ab-cursor.on { opacity: 1; }
    .ab-cursor svg { width: 18px; height: 18px; display: block; }
    .ab-ripple {
      position: absolute;
      left: -14px; top: -14px;
      width: 28px; height: 28px;
      border-radius: 50%;
      border: 2px solid var(--accent);
      opacity: 0;
      pointer-events: none;
      z-index: 4;
    }
    .ab-ripple.go { animation: abRipple 0.45s ease-out; }
    @keyframes abRipple { from { opacity: 0.9; scale: 0.3; } to { opacity: 0; scale: 1.4; } }

    .ab-status {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 5px 11px;
      border-top: 1px solid var(--border);
      background: #141418;
      font-family: var(--mono);
      font-size: 10px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      flex-shrink: 0;
    }
    .ab-status span:last-child { overflow: hidden; text-overflow: ellipsis; }

    /* The pretend page. Its hue comes from the site's name, so each site
       looks a little different without anything being fetched. */
    .abp {
      position: absolute;
      left: 0; top: 0;
      width: 760px;
      padding-bottom: 40px;
      transform-origin: 0 0;
      transition: transform 0.5s cubic-bezier(0.3, 0.7, 0.2, 1), opacity 0.2s;
      color: #d6d6dc;
      font-family: var(--sans);
      font-size: 14px;
      animation: abpIn 0.28s ease-out;
    }
    .abp.leaving { opacity: 0; }
    @keyframes abpIn { from { opacity: 0; } to { opacity: 1; } }
    .abp-top {
      display: flex;
      align-items: center;
      gap: 12px;
      height: 56px;
      padding: 0 28px;
      background: hsl(var(--h) 28% 13%);
      border-bottom: 1px solid hsl(var(--h) 28% 20%);
    }
    .abp-logo {
      width: 28px; height: 28px;
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      background: hsl(var(--h) 62% 58%);
      color: #111;
      font-weight: 700;
      font-size: 15px;
      text-transform: uppercase;
      flex-shrink: 0;
    }
    .abp-site { font-weight: 700; font-size: 15px; color: #f0f0f3; white-space: nowrap; }
    .abp-navlinks { margin-left: auto; display: flex; gap: 18px; font-size: 13px; color: hsl(var(--h) 25% 72%); white-space: nowrap; overflow: hidden; }
    .abp-hero { padding: 34px 28px 14px; }
    .abp-hero h1 { font-size: 30px; line-height: 1.2; font-weight: 700; color: #f4f4f6; margin-bottom: 14px; overflow-wrap: anywhere; }
    .abp-body { padding: 8px 28px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px 26px; align-items: start; }
    .abp-wide { grid-column: 1 / -1; }
    .abp-line { height: 10px; border-radius: 5px; background: #25252b; margin: 9px 0; }
    .abp-link {
      font-size: 15px;
      color: hsl(var(--h) 72% 72%);
      text-decoration: underline;
      text-underline-offset: 3px;
      padding: 5px 0;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .abp-btn {
      justify-self: start;
      max-width: 100%;
      padding: 10px 18px;
      border-radius: 9px;
      background: hsl(var(--h) 62% 58%);
      color: #101012;
      font-weight: 600;
      font-size: 14px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .abp-input {
      display: flex;
      align-items: center;
      min-height: 42px;
      padding: 0 14px;
      border: 1px solid #3a3a44;
      border-radius: 9px;
      background: #0c0c0f;
      font-size: 14px;
      color: #77777f;
      overflow: hidden; white-space: nowrap;
    }
    .abp-input .val { color: #f0f0f3; }
    .abp-input.focus { border-color: hsl(var(--h) 62% 58%); box-shadow: 0 0 0 3px hsl(var(--h) 62% 58% / 0.2); }
    .hit { transition: transform 0.12s, filter 0.12s, outline-color 0.2s; outline: 2px solid transparent; outline-offset: 3px; border-radius: 6px; }
    .hit.target  { outline-color: var(--accent); }
    .hit.pressed { transform: scale(0.95); filter: brightness(1.25); }
    /* Loading: one sheen crossing the page, not one per block. */
    .abp.loading::after {
      content: '';
      position: absolute;
      top: 0; bottom: 0; left: 0;
      width: 45%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.045), transparent);
      animation: abSheen 1.2s ease-in-out infinite;
    }
    @keyframes abSheen { from { transform: translateX(-100%); } to { transform: translateX(330%); } }
    .abp-error { padding: 80px 60px; text-align: center; }
    .abp-error .big { font-size: 46px; margin-bottom: 14px; }
    .abp-error h1 { font-size: 22px; margin-bottom: 10px; color: #f0f0f3; }
    .abp-error p { font-family: var(--mono); font-size: 12px; color: #88888f; line-height: 1.6; overflow-wrap: anywhere; }
    /* Search results page. */
    .abp-sbar { display: flex; align-items: center; gap: 16px; padding: 22px 28px 16px; border-bottom: 1px solid #222228; }
    .abp-sbar .abp-input { flex: 1; border-radius: 999px; }
    .abp-results { padding: 10px 28px; }
    .abp-result { padding: 12px 0; }
    .abp-r-url { font-family: var(--mono); font-size: 11.5px; color: #7fb069; margin-bottom: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .abp-r-title { font-size: 17px; color: hsl(var(--h) 72% 74%); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .abp-result .abp-line { width: 88%; margin: 7px 0 0; }

    /* Where the agent's browser lives on a phone: a picture-in-picture card
       in the corner, rather than a sheet over the chat it's working for. */
    @media (max-width: 719px) {
      #win-agent.win {
        left: auto !important; right: 8px;
        top: 8px !important;
        width: min(320px, calc(100% - 16px)) !important;
        height: 236px !important;
        border-radius: 11px;
        border-width: 1px;
      }
    }

    .app-icon.launch .app-tile { animation: iconLaunch 0.7s cubic-bezier(0.3, 0.7, 0.3, 1); }
    @keyframes iconLaunch {
      0%, 100% { transform: none; }
      35% { transform: translateY(-10px) scale(1.08); }
      65% { transform: translateY(0) scale(0.97); }
    }

    /* ── App window ──
       What double-clicking an installed MCP app opens: its icon, what it is,
       and the one choice that lives here — on or off. Removing it is the App
       Store's job. */
    .mw {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 6px;
      padding: 22px 20px 18px;
      background: var(--surface);
    }
    .mw-icon {
      width: 64px; height: 64px;
      border-radius: 17px;
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(160deg, var(--tile-a, #1d1d22), var(--tile-b, #121215));
      border: 1px solid rgba(255,255,255,0.07);
      box-shadow: 0 10px 26px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.06);
      margin-bottom: 6px;
      transition: filter 0.2s, opacity 0.2s, box-shadow 0.3s;
    }
    .mw-icon img { width: 36px; height: 36px; object-fit: contain; border-radius: 8px; }
    .mw-icon .app-letter { font-weight: 700; font-size: 28px; color: hsl(var(--h, 80) 70% 70%); text-transform: uppercase; }
    .mw-icon.letter { --tile-a: hsl(var(--h, 80) 30% 17%); --tile-b: hsl(var(--h, 80) 30% 9%); }
    .mw.off .mw-icon { filter: grayscale(1) brightness(0.7); opacity: 0.5; }
    .mw.using .mw-icon { box-shadow: 0 0 0 1px rgba(200,240,74,0.6), 0 0 24px 4px rgba(200,240,74,0.4); }
    .mw-name { font-size: 18px; font-weight: 700; }
    .mw-sub {
      font-family: var(--mono); font-size: 10px; color: var(--muted);
      max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .mw-status { font-family: var(--mono); font-size: 11px; color: var(--muted); margin: 8px 0 4px; min-height: 16px; }
    .mw-status b { color: var(--accent); font-weight: 500; }
    .mw.off .mw-status b { color: var(--text); }
    .mw.using .mw-status::before {
      content: ''; display: inline-block; width: 6px; height: 6px; border-radius: 50%;
      background: var(--accent); box-shadow: 0 0 6px var(--accent); margin-right: 7px; vertical-align: 1px;
      animation: pulse 1.4s ease-in-out infinite;
    }
    .mw-seg {
      display: inline-flex; border: 1px solid var(--border); border-radius: 10px; overflow: hidden;
      background: var(--bg);
    }
    .mw-seg button {
      background: none; border: none; color: var(--muted);
      font-family: var(--sans); font-weight: 600; font-size: 13px;
      padding: 9px 22px; cursor: pointer; transition: background 0.15s, color 0.15s;
    }
    .mw-seg button + button { border-left: 1px solid var(--border); }
    .mw-seg button:hover:not(:disabled) { color: var(--text); }
    .mw-seg button.on-btn.active  { background: var(--accent); color: #10100c; }
    .mw-seg button.off-btn.active { background: #2a2a31; color: var(--text); }
    .mw-seg button:disabled { cursor: default; }
    .mw-msg { font-family: var(--mono); font-size: 10.5px; line-height: 1.5; min-height: 15px; margin-top: 4px; }
    .mw-msg.err { color: var(--err); }
    .mw-msg.warn { color: #e0b43c; }
    .mw-note { font-family: var(--mono); font-size: 10px; color: var(--muted); margin-top: auto; padding-top: 12px; line-height: 1.6; }
    .mw-note a { color: var(--accent-dim); cursor: pointer; text-decoration: none; }
    .mw-note a:hover { text-decoration: underline; }
    #win-mcp .win-title .mw-title-ico { width: 13px; height: 13px; border-radius: 3px; object-fit: contain; }

    /* Softer corners inside the floating composer. */
    #user-input, #send-btn, #stop-btn, #upload-btn, #file-preview { border-radius: 9px; }
    #user-input { background: rgba(13,13,15,0.7); }

    /* Leaving for the user picker. */
    body.leaving #desktop, body.leaving #windows { opacity: 0; transform: scale(0.985); transition: opacity 0.2s ease, transform 0.2s ease; }

  </style>
</head>
<body>

<div id="splash">
  <div class="splash-icon"><img src="https://freeclaw.eedeb.dev/eagle.png" alt="FreeClaw"/></div>
  <div class="splash-name">FreeClaw</div>
  <div class="splash-sub">an AI agent that doesn't burn your money</div>
</div>

<!-- App glyphs, drawn once and reused by the icons, window titles and task pills. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-browser" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3c2.6 2.6 3.8 5.6 3.8 9s-1.2 6.4-3.8 9c-2.6-2.6-3.8-5.6-3.8-9S9.4 5.6 12 3z"/>
  </symbol>
  <symbol id="i-files" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 7.5A2.5 2.5 0 0 1 5.5 5H9l2 2.2h7.5A2.5 2.5 0 0 1 21 9.7v7.8a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5z"/><path d="M3 10.5h18"/>
  </symbol>
  <symbol id="i-settings" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/>
  </symbol>
  <symbol id="i-agent" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20 11.5V7a2.5 2.5 0 0 0-2.5-2.5h-12A2.5 2.5 0 0 0 3 7v10a2.5 2.5 0 0 0 2.5 2.5H11"/><path d="M3 9h17"/><path d="m14 13 7 2.6-3 1.1-1.1 3z"/>
  </symbol>
  <symbol id="i-home" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3.5 11 12 4l8.5 7"/><path d="M5.5 9.5V20h13V9.5"/><path d="M10 20v-5.5h4V20"/>
  </symbol>
  <symbol id="i-appstore" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5 8h14l-1.2 11.2A2 2 0 0 1 15.8 21H8.2a2 2 0 0 1-2-1.8z"/><path d="M9 10.5V7a3 3 0 0 1 6 0v3.5"/><path d="M12 13.5v4M10 15.5h4"/>
  </symbol>
  <symbol id="i-mcp" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><path d="M16.5 13.5v6M13.5 16.5h6"/>
  </symbol>
</svg>

<header id="topbar">
  <div class="header-icon">
    <img src="https://freeclaw.eedeb.dev/eagle.png" alt="FreeClaw"/>
  </div>
  <div class="header-dot"></div>
  <div class="header-title">
    <h1 id="chat-user-name">FreeClaw</h1>
    <span class="header-tagline" id="chat-title">an AI agent that doesn't burn your money</span>
  </div>
  <nav id="tasks" aria-label="Open windows"></nav>
  <div class="header-right">
    <span id="token-count">~0 tokens</span>
    <button id="reset-btn">reset</button>
    <span id="clock"></span>
  </div>
</header>

<div id="desktop">
  <div id="wallpaper" aria-hidden="true">
    <div class="eagle-wrap"><img src="https://freeclaw.eedeb.dev/eagle.png" alt=""/></div>
    <div class="empty-name">FreeClaw</div>
    <div class="empty-sub">search the web · run bash<br>connect MCP tools · write files</div>
  </div>

  <!-- Double-click to open (a tap on touch screens); drag to rearrange. -->
  <div id="icons">
    <button class="app-icon" id="icon-browser" data-app="browser" title="Browser" hidden>
      <span class="app-tile"><svg><use href="#i-browser"/></svg></span>
      <span class="app-label">Browser</span>
    </button>
    <button class="app-icon" id="icon-files" data-app="files" title="Files">
      <span class="app-tile"><svg><use href="#i-files"/></svg></span>
      <span class="app-label">Files</span>
    </button>
    <button class="app-icon" id="icon-settings" data-app="settings" title="Settings">
      <span class="app-tile"><svg><use href="#i-settings"/></svg></span>
      <span class="app-label">Settings</span>
    </button>
    <button class="app-icon" id="icon-appstore" data-app="appstore" title="App Store">
      <span class="app-tile"><svg><use href="#i-appstore"/></svg></span>
      <span class="app-label">App Store</span>
    </button>
    <!-- Installed MCP apps are added after this by refreshMcpApps(). -->
    <button class="app-icon" id="icon-home" data-app="home" title="Back to users">
      <span class="app-tile"><svg><use href="#i-home"/></svg></span>
      <span class="app-label">Home</span>
    </button>
  </div>

  <div id="chat">
    <div id="messages">
      <div id="empty-state"></div>
    </div>

    <div id="input-area">
      <div id="file-preview">
        <div id="file-preview-bar"></div>
        <span id="file-preview-name">filename.txt</span>
        <span id="file-preview-status">ready</span>
        <button id="file-remove-btn" title="Remove file">✕</button>
      </div>
      <div id="input-row">
        <button id="upload-btn" title="Attach file">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"/>
            <line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
        </button>
        <input type="file" id="file-input" style="display:none"/>
        <textarea id="user-input" placeholder="Ask anything…" rows="1"></textarea>
        <button id="send-btn" title="Send">
          <svg viewBox="0 0 24 24" fill="none" stroke="#0d0d0f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="19" x2="12" y2="5"/>
            <polyline points="5 12 12 5 19 12"/>
          </svg>
        </button>
        <button id="stop-btn" title="Stop generating">
          <svg viewBox="0 0 24 24" fill="#0d0d0f" aria-hidden="true">
            <rect x="7" y="7" width="10" height="10" rx="1.5"/>
          </svg>
        </button>
      </div>
    </div>
  </div>
</div>

<div id="windows">
  <!-- Browser and Settings are their own pages, loaded into a frame the first
       time the window opens and dropped again when it closes. -->
  <section class="win" id="win-browser" data-app="browser" hidden aria-label="Browser">
    <div class="win-bar">
      <div class="win-lights">
        <button class="wl close" data-glyph="×" title="Close"></button>
        <button class="wl min" data-glyph="–" title="Minimize"></button>
        <button class="wl max" data-glyph="+" title="Maximize"></button>
      </div>
      <div class="win-title"><svg><use href="#i-browser"/></svg><span class="wt-text">Browser</span></div>
    </div>
    <div class="win-body"></div>
    <div class="win-resize"></div>
  </section>

  <section class="win" id="win-settings" data-app="settings" hidden aria-label="Settings">
    <div class="win-bar">
      <div class="win-lights">
        <button class="wl close" data-glyph="×" title="Close"></button>
        <button class="wl min" data-glyph="–" title="Minimize"></button>
        <button class="wl max" data-glyph="+" title="Maximize"></button>
      </div>
      <div class="win-title"><svg><use href="#i-settings"/></svg>Settings</div>
    </div>
    <div class="win-body"></div>
    <div class="win-resize"></div>
  </section>

  <section class="win" id="win-appstore" data-app="appstore" hidden aria-label="App Store">
    <div class="win-bar">
      <div class="win-lights">
        <button class="wl close" data-glyph="×" title="Close"></button>
        <button class="wl min" data-glyph="–" title="Minimize"></button>
        <button class="wl max" data-glyph="+" title="Maximize"></button>
      </div>
      <div class="win-title"><svg><use href="#i-appstore"/></svg>App Store</div>
    </div>
    <div class="win-body"></div>
    <div class="win-resize"></div>
  </section>

  <!-- One installed MCP app at a time: switch it on or off. -->
  <section class="win" id="win-mcp" data-app="mcp" hidden aria-label="App">
    <div class="win-bar">
      <div class="win-lights">
        <button class="wl close" data-glyph="×" title="Close"></button>
        <button class="wl min" data-glyph="–" title="Minimize"></button>
        <button class="wl max" data-glyph="+" title="Maximize"></button>
      </div>
      <div class="win-title"><svg><use href="#i-mcp"/></svg><span class="mw-title">App</span></div>
    </div>
    <div class="win-body">
      <div class="mw">
        <div class="mw-icon"></div>
        <div class="mw-name"></div>
        <div class="mw-sub"></div>
        <div class="mw-status"></div>
        <div class="mw-seg" role="group" aria-label="Enable or disable">
          <button type="button" class="on-btn">Enable</button>
          <button type="button" class="off-btn">Disable</button>
        </div>
        <div class="mw-msg"></div>
        <div class="mw-note"></div>
      </div>
    </div>
    <div class="win-resize"></div>
  </section>

  <!-- Opens itself while the agent uses its browser tools, and replays what
       they did. Nothing in here is a real page. -->
  <section class="win" id="win-agent" data-app="agent" hidden aria-label="Agent browser">
    <div class="win-bar">
      <div class="win-lights">
        <button class="wl close" data-glyph="×" title="Close"></button>
        <button class="wl min" data-glyph="–" title="Minimize"></button>
        <button class="wl max" data-glyph="+" title="Maximize"></button>
      </div>
      <div class="win-title"><span class="ab-live"></span>Agent browser</div>
    </div>
    <div class="win-body">
      <div class="ab-chrome">
        <div class="ab-nav" aria-hidden="true"><span>←</span><span>→</span><span>↻</span></div>
        <div class="ab-addr">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
          <span class="ab-url"></span><span class="ab-caret"></span>
        </div>
      </div>
      <div class="ab-view">
        <div class="ab-progress"></div>
        <div class="ab-scan"></div>
        <div class="ab-ripple"></div>
        <div class="ab-cursor"><svg viewBox="0 0 24 24"><path d="M5 3l14 8.2-6.3 1.4 3.6 6.9-2.6 1.3-3.6-6.9L5 18.5z" fill="#fff" stroke="#111" stroke-width="1.4" stroke-linejoin="round"/></svg></div>
      </div>
      <div class="ab-status"><span class="ab-live"></span><span class="ab-status-text">Waiting for the agent…</span></div>
    </div>
    <div class="win-resize"></div>
  </section>

  <section class="win" id="win-files" data-app="files" hidden aria-label="Files">
    <div class="win-bar">
      <div class="win-lights">
        <button class="wl close" data-glyph="×" title="Close"></button>
        <button class="wl min" data-glyph="–" title="Minimize"></button>
        <button class="wl max" data-glyph="+" title="Maximize"></button>
      </div>
      <div class="win-title"><svg><use href="#i-files"/></svg>Files</div>
    </div>
    <div class="win-body">
      <div id="context-panel">
        <div class="ctx-head">
          <button id="ctx-back" title="Back" hidden>←</button>
          <span class="ctx-title" id="ctx-title">files</span>
          <span class="ctx-user" id="ctx-user"></span>
        </div>

        <div id="ctx-list-view">
          <ul id="ctx-list"></ul>
          <div id="ctx-list-empty" hidden></div>
        </div>

        <div id="ctx-file-view" hidden>
          <textarea id="ctx-text" spellcheck="false" autocapitalize="off" autocorrect="off"
                    placeholder="Loading…" hidden></textarea>
          <div id="ctx-image-wrap" hidden><img id="ctx-image" alt=""/></div>
          <div id="ctx-binary" hidden></div>
        </div>

        <div class="ctx-foot">
          <span id="ctx-status"></span>
          <button id="ctx-delete" hidden>delete</button>
          <button id="ctx-save" hidden>save</button>
        </div>
      </div>
    </div>
    <div class="win-resize"></div>
  </section>
</div>

<script>
  const messagesEl  = document.getElementById('messages');
  const inputEl     = document.getElementById('user-input');
  const sendBtn     = document.getElementById('send-btn');
  const stopBtn     = document.getElementById('stop-btn');
  const countEl     = document.getElementById('token-count');
  const resetBtn    = document.getElementById('reset-btn');
  const chatUserEl  = document.getElementById('chat-user-name');
  const chatTitleEl = document.getElementById('chat-title');
  const splash      = document.getElementById('splash');
  const uploadBtn   = document.getElementById('upload-btn');
  const fileInput   = document.getElementById('file-input');
  const filePreview = document.getElementById('file-preview');
  const fileBar     = document.getElementById('file-preview-bar');
  const fileName    = document.getElementById('file-preview-name');
  const fileStatus  = document.getElementById('file-preview-status');
  const fileRemove  = document.getElementById('file-remove-btn');

  // Show splash only when running as installed PWA
  const isStandalone = window.navigator.standalone === true
    || window.matchMedia('(display-mode: standalone)').matches;

  if (isStandalone) {
    splash.classList.add('visible');
    setTimeout(() => splash.classList.add('hide'), 1100);
  }

  let totalTokens  = 0;
  let pendingFile  = null;
  let uploading    = false;
  // Whose conversation this tab is showing. The server keeps it in the Flask
  // session, so nothing here needs to send it — except the context.md routes,
  // which are addressed by user name.
  let currentUser  = null;

  // Exact token counts as reported by the provider, when it reports any. Not
  // every OpenAI-compatible endpoint does, so the length/4 estimate stays as
  // the fallback — hence the leading '~' only ever appearing on estimates.
  //
  // Worth knowing what these mean, because they aren't the same thing the
  // estimate measures: `context` is the prompt size of the LAST request, i.e.
  // what the model actually read. History windowing sends only a slice of the
  // conversation, so this is normally well below the whole-conversation
  // estimate — that's the windowing working, not tokens going missing.
  // `scope` is 'turn' when these totals cover a whole turn we watched happen
  // (possibly several requests), or 'message' when they were recovered from a
  // saved assistant message on load — which only ever describes one request.
  let realUsage = null;   // { context, prompt, completion, cached, requests, scope }

  const estimate = str => Math.ceil((str || '').length / 4);
  const fmt = n => (n || 0).toLocaleString();
  marked.setOptions({ breaks: true, gfm: true });

  function updateCount() {
    if (realUsage) {
      countEl.textContent = fmt(realUsage.context) + ' tokens';
      const lines = [
        `${fmt(realUsage.context)} tokens in the last request's prompt — what the model read.`,
        '',
        (realUsage.scope === 'turn' ? 'This turn: ' : 'Last reply: ')
          + `${fmt(realUsage.prompt)} sent, ${fmt(realUsage.completion)} received`
          + (realUsage.requests > 1 ? ` across ${realUsage.requests} requests` : ''),
      ];
      if (realUsage.cached > 0) {
        const pct = realUsage.prompt > 0
          ? Math.round((realUsage.cached / realUsage.prompt) * 100) : 0;
        lines.push(`${fmt(realUsage.cached)} of those sent tokens came from the provider's cache (${pct}%)`);
      }
      lines.push('', 'Reported by the provider, not estimated.');
      countEl.title = lines.join('\n');
      countEl.classList.add('exact');
    } else {
      countEl.textContent = '~' + fmt(totalTokens) + ' tokens';
      countEl.title = 'Estimated from message length — this provider doesn\'t report '
        + 'token counts. Covers the whole conversation, not just what each request sends.';
      countEl.classList.remove('exact');
    }
  }

  function removeEmpty() {
    const el = document.getElementById('empty-state');
    if (el) el.remove();
  }

  // Clear the thread back to the eagle placeholder, zeroing the token counts
  // with it. renderConversation() always wipes messagesEl and doesn't know how
  // to rebuild the placeholder, so every caller that can land on an empty
  // conversation (/reset, a background reload) comes through here instead.
  function showEmptyState() {
    messagesEl.innerHTML = '';
    totalTokens = 0;
    realUsage = null;
    updateCount();
    const empty = document.createElement('div');
    empty.id = 'empty-state';
    empty.innerHTML = `
      <div class="eagle-wrap"><img src="https://freeclaw.eedeb.dev/eagle.png" alt=""/></div>
      <div class="empty-name">FreeClaw</div>
      <div class="empty-sub">search the web · run bash<br>connect MCP tools · write files</div>`;
    messagesEl.appendChild(empty);
  }

  // ── Agent message label: "agent · via groq · 412 out · 3.1k cached" ──
  // The token parts only appear when the provider reported them.
  function tokenLabel(usage) {
    if (!usage) return '';
    const parts = [];
    if (usage.completion_tokens) parts.push(fmt(usage.completion_tokens) + ' out');
    if (usage.cached_tokens) parts.push(fmt(usage.cached_tokens) + ' cached');
    return parts.length ? ' · ' + parts.join(' · ') : '';
  }

  // `intent` is the winning classifier tag for the turn (Smalltalk, Code, …).
  // It replaces the literal 'agent' when we have one; turns that never got
  // classified — sub-agents, system-initiated turns, history from before this
  // shipped — fall back to 'agent'.
  //
  // `sourced` marks a reply that actually ran a search before answering. Only
  // shown when true, so its *absence* is the signal worth reading: a reply
  // naming outlets, reports or dates without it took them from the model's
  // weights, and an invented citation is indistinguishable from a real one in
  // the text alone. Not available while the turn is still streaming (nothing
  // knows yet whether it will search) — it appears when the 'done' event
  // re-renders the thread from the saved conversation.
  function agentLabelText(provider, usage, intent, sourced) {
    return (intent || 'agent')
         + (provider ? ' · via ' + provider : '')
         + (sourced ? ' · sourced' : '')
         + tokenLabel(usage);
  }

  function updateLiveLabel(wrap, provider, usage, intent) {
    const lbl = wrap.querySelector('.msg-label');
    if (lbl) lbl.textContent = agentLabelText(provider, usage, intent);
  }

  // ── Render a single user/agent text bubble ──────────────
  // opts.countTokens (default true) controls whether this call bumps the
  // running token estimate. When renderConversation() re-renders the full
  // history from the server payload, it computes the token total itself
  // (covering tool calls/results too), so bubble-level counting is skipped
  // here to avoid double-counting.
  function addMessage(role, text, imageUrl, opts) {
    const countTokens = !opts || opts.countTokens !== false;
    removeEmpty();
    if (countTokens) {
      totalTokens += estimate(text);
      updateCount();
    }
    const wrap = document.createElement('div');
    wrap.className = `message ${role}`;
    const label = document.createElement('div');
    label.className = 'msg-label';
    const provider = opts && opts.provider;
    label.textContent = role === 'user' ? 'you'
      : agentLabelText(provider, opts && opts.usage, opts && opts.intent,
                       opts && opts.sourced);
    const bubble = document.createElement('div');
    bubble.className = 'bubble';

    if (imageUrl) {
      const link = document.createElement('a');
      link.href = imageUrl;
      link.target = '_blank';
      link.rel = 'noopener';
      link.className = 'msg-image-link';
      const img = document.createElement('img');
      img.src = imageUrl;
      img.alt = 'Uploaded image';
      img.className = 'msg-image';
      img.loading = 'lazy';
      link.appendChild(img);
      bubble.appendChild(link);
    }

    if (role === 'agent') {
      bubble.insertAdjacentHTML('beforeend', marked.parse(text || ''));
    } else if (text) {
      const caption = document.createElement('div');
      caption.className = imageUrl ? 'msg-caption' : '';
      caption.textContent = text;
      bubble.appendChild(caption);
    }

    wrap.appendChild(label);
    wrap.appendChild(bubble);
    messagesEl.appendChild(wrap);
    return wrap;
  }

  // ── Render a collapsible tool-call + result block ────────
  function addToolBlock(toolName, argsStr, resultStr, isError) {
    removeEmpty();

    const group = document.createElement('div');
    group.className = 'tool-group';

    // Toggle pill
    const toggle = document.createElement('div');
    toggle.className = 'tool-toggle';
    toggle.innerHTML = `<i class="tool-toggle-arrow">▶</i><span>tool: ${toolName}</span>`;

    // Details panel
    const details = document.createElement('div');
    details.className = 'tool-details';

    // Call section
    const callSec = document.createElement('div');
    callSec.className = 'tool-section';
    callSec.innerHTML = `<div class="tool-section-label">call · <span class="tool-name">${toolName}</span></div>`;
    const callPre = document.createElement('pre');
    callPre.className = 'tool-code';
    try {
      callPre.textContent = JSON.stringify(JSON.parse(argsStr), null, 2);
    } catch {
      callPre.textContent = argsStr || '';
    }
    callSec.appendChild(callPre);
    details.appendChild(callSec);

    // Result section
    const resSec = document.createElement('div');
    resSec.className = 'tool-section';
    resSec.innerHTML = `<div class="tool-section-label">result</div>`;
    const resPre = document.createElement('pre');
    resPre.className = `tool-code ${isError ? 'tool-result-err' : 'tool-result-ok'}`;
    resPre.textContent = resultStr || '';
    resSec.appendChild(resPre);
    details.appendChild(resSec);

    // Toggle behaviour
    toggle.addEventListener('click', () => {
      const open = details.classList.toggle('open');
      toggle.classList.toggle('open', open);
    });

    group.appendChild(toggle);
    group.appendChild(details);
    messagesEl.appendChild(group);
    return group;
  }

  // ── Reasoning block ──────────────────────────────────────
  // Reasoning models stream their thinking on a field of its own, ahead of the
  // reply (the "reasoning" event out of agent_stream). Returns a handle so the
  // one builder serves both jobs: the live stream appends to it as chunks
  // land, and renderConversation() hands it the finished text on reload.
  //
  // Not counted in the token estimate below on purpose — it's stripped from
  // the history before any request goes out, so it never costs context.
  function addReasoningBlock(text, live) {
    removeEmpty();

    const group = document.createElement('div');
    group.className = 'tool-group' + (live ? ' reasoning-live' : '');

    const toggle = document.createElement('div');
    toggle.className = 'tool-toggle';
    toggle.innerHTML = `<i class="tool-toggle-arrow">▶</i><span class="reasoning-label">${live ? 'reasoning…' : 'see reasoning'}</span>`;

    const details = document.createElement('div');
    details.className = 'tool-details';

    const sec = document.createElement('div');
    sec.className = 'tool-section';
    const body = document.createElement('pre');
    body.className = 'reasoning-body';
    body.textContent = text || '';
    sec.appendChild(body);
    details.appendChild(sec);

    toggle.addEventListener('click', () => {
      const open = details.classList.toggle('open');
      toggle.classList.toggle('open', open);
    });

    group.appendChild(toggle);
    group.appendChild(details);
    messagesEl.appendChild(group);

    return {
      wrap: group,
      append(chunk) {
        body.textContent += chunk;
        // Only chase the bottom while the panel is open. A collapsed block
        // isn't growing on screen, and scrolling for it would yank the view
        // away from someone reading back through the thread.
        if (details.classList.contains('open')) {
          messagesEl.scrollTop = messagesEl.scrollHeight;
        }
      },
      finish() {
        group.classList.remove('reasoning-live');
